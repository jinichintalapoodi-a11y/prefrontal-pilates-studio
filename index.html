<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prefrontal Pilates Studio | Sanctuary Console</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400;1,700&display=swap" rel="stylesheet">
    <style>
        * { font-family:'Playfair Display',serif!important;font-style:italic!important;font-weight:400!important;box-sizing:border-box;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale }
        :root{--champagne-gold:#f7e7ce;--gold-alpha:rgba(247,231,206,.4);--amethyst-glass:rgba(25,15,35,.45);--luxury-bezier:cubic-bezier(.645,.045,.355,1)}
        body,html{margin:0;padding:0;background-color:#050706;overflow:hidden;width:100%;height:100%} body,p,div,span,h1,h2,h3,button,li{color:var(--champagne-gold)!important;text-shadow:0 0 1px rgba(247,231,206,.2)}
        #studio-stage{height:100vh;width:100vw;position:relative;overflow:hidden}.ambient-backdrop{position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity 1.2s var(--luxury-bezier)}#bg-garden{background-image:url('wisteria_path.jpg');z-index:1}body.cinematic-door-parting #bg-garden{opacity:0}#bg-space-backing{background-image:url('star_gazer.jpeg');z-index:2;opacity:0;visibility:hidden}body.cinematic-door-parting #bg-space-backing{opacity:1;visibility:visible}
        .universal-viewport-box{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:75vh;z-index:100;overflow:hidden;border-radius:240px 240px 0 0;border:2px solid rgba(247,231,206,.8);border-bottom:none;background:var(--amethyst-glass);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);transition:all 1.2s var(--luxury-bezier)}#main-archway{pointer-events:none!important}#content-portal{z-index:500;pointer-events:none}.door-panel-wrapper{position:absolute;inset:0;width:100%;height:100%;display:flex;flex-direction:row;justify-content:space-between;align-items:stretch}.door{width:50%;height:100%;z-index:10;transition:transform 1.4s var(--luxury-bezier);position:relative;background:linear-gradient(90deg,rgba(35,20,46,.28),rgba(68,42,78,.20));border-color:rgba(247,231,206,.24);border-style:solid}.door:first-child{border-width:0 1px 0 0}.door:last-child{border-width:0 0 0 1px}body.cinematic-door-parting #door-L{transform:translateX(-100%)}body.cinematic-door-parting #door-R{transform:translateX(100%)}body.cinematic-door-parting .universal-viewport-box{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;border-color:rgba(247,231,206,.15)}body.show-studio-grid #portal-inner-home{display:none!important}body.show-studio-grid #portal-inner-practice{display:flex!important}.handle-rod{position:absolute;top:130px;height:250px;width:1px;background:var(--champagne-gold);box-shadow:0 0 15px var(--gold-alpha);z-index:20;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .4s ease}#handle-L{right:0}#handle-R{left:0}body.show-studio-grid .handle-rod{opacity:1;visibility:visible}body.cinematic-door-parting .handle-rod{opacity:0;visibility:hidden}.practice-column{width:50%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:135px 8px 40px;z-index:9999!important;pointer-events:auto!important;overflow-y:auto}#portal-inner-home{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;width:100%;text-align:center;pointer-events:auto!important;padding:0 20px}#portal-inner-practice{display:none;flex-direction:column;align-items:center;justify-content:flex-start;height:100%;width:100%;text-align:center;padding:0 10px}.panel-header{position:absolute;top:20px;width:90%;left:5%;text-align:center;z-index:9999!important;pointer-events:none}.header-line-1{font-size:1.4rem;margin-bottom:4px;display:block;line-height:1.2;font-weight:700!important}.header-line-2{font-size:.85rem;opacity:.85;display:block;letter-spacing:2px}.welcome-sub{font-size:1.1rem;letter-spacing:5px;width:100%;white-space:nowrap;text-transform:capitalize;margin-bottom:15px}h1{font-size:1.8rem;margin:0 0 25px;line-height:1.15;font-weight:700!important}.studio-btn{border:1px solid var(--gold-alpha);border-radius:40px;padding:10px 15px;background:transparent;cursor:pointer!important;font-size:.8rem;transition:all .4s var(--luxury-bezier);display:inline-block;margin:5px 0;outline:none;z-index:9999!important;pointer-events:auto!important;width:100%;max-width:190px;text-align:center}.studio-btn:hover{border-color:var(--champagne-gold);background:rgba(247,231,206,.1);box-shadow:0 0 15px rgba(247,231,206,.25)}.studio-btn:active{transform:scale(.97)}.domain-tag{font-size:.55rem;text-transform:uppercase;letter-spacing:1px;opacity:.6;margin-bottom:3px;pointer-events:none}/* Bottom-anchored double-door portal: balanced 5x2 practice layout. */
        .universal-viewport-box{position:fixed;left:50%;top:auto;bottom:0;transform:translateX(-50%);width:min(88vw,680px);height:min(86vh,780px);max-width:none;aspect-ratio:auto;border-radius:46% 46% 0 0/20% 20% 0 0;border:2px solid rgba(247,231,206,.8);border-bottom:none;background:var(--amethyst-glass)}
        #portal-inner-practice{padding:0 40px 26px;display:none;grid-template-rows:148px 1fr}
        body.show-studio-grid #portal-inner-practice{display:grid!important}
        .panel-header{position:relative;top:auto;left:auto;width:100%;height:148px;padding-top:18px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;z-index:9999!important}
        .panel-header .studio-btn{margin:0 0 9px}
        .header-line-1{font-size:1.45rem;margin-bottom:4px}
        .header-line-2{font-size:.84rem}
        #practice-grid{position:relative;width:100%;height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:42px;padding:4px 10px 20px;pointer-events:auto;z-index:9999}
        #practice-grid:after{content:'';position:absolute;left:50%;top:0;bottom:10px;width:2px;transform:translateX(-1px);background:linear-gradient(to bottom,rgba(247,231,206,.18),rgba(247,231,206,.72) 15%,rgba(247,231,206,.42) 90%,transparent);box-shadow:0 0 14px rgba(247,231,206,.2);pointer-events:none}
        .practice-door{display:grid;grid-template-rows:repeat(5,minmax(0,1fr));row-gap:10px;align-items:center;min-width:0}
        .practice-door.left{padding-right:0}.practice-door.right{padding-left:0}
        #practice-grid .studio-btn{width:100%;max-width:none;margin:0;padding:10px 13px;justify-self:stretch}
        .handle-rod{top:150px;height:calc(100% - 185px)}
        @media(max-height:760px) and (min-width:481px){.universal-viewport-box{width:min(82vw,620px);height:min(91vh,700px)}#portal-inner-practice{grid-template-rows:126px 1fr;padding:0 34px 18px}.panel-header{height:126px;padding-top:10px}.panel-header .studio-btn{padding:5px 17px!important;margin-bottom:6px!important}.header-line-1{font-size:1.22rem}.header-line-2{font-size:.74rem}#practice-grid{padding-bottom:10px;column-gap:34px}.practice-door{row-gap:6px}#practice-grid .studio-btn{padding:7px 11px}}
        @media(max-width:480px){#bg-garden{background-image:url('wisteria_mobile.jpeg')!important}#bg-space-backing{background-image:url('star_gazer_mobile.jpeg')!important}}
    </style>
</head><body><div id="studio-stage"><div id="bg-garden" class="ambient-backdrop"></div><div id="bg-space-backing" class="ambient-backdrop"></div><div id="main-archway" class="universal-viewport-box"><div class="door-panel-wrapper"><div id="door-L" class="door"><div id="handle-L" class="handle-rod"></div></div><div id="door-R" class="door"><div id="handle-R" class="handle-rod"></div></div></div></div><div id="content-portal" class="universal-viewport-box"><div id="portal-inner-home"><div id="top-tier"><div class="welcome-sub" id="welcome-text">Welcome to your</div></div><div id="mid-tier"><h1>Prefrontal Pilates Studio</h1></div><div id="bot-tier"><button class="studio-btn" id="start-btn" style="width:auto;padding:12px 40px" onclick="Studio.showChoice()">BEGIN</button></div></div><div id="portal-inner-practice"><div class="panel-header"><button class="studio-btn" style="font-size:.85rem;padding:6px 20px;margin-bottom:12px;border-radius:20px;width:auto" onclick="window.location.href='index.html'">Exit Studio</button><span class="header-line-1">Prefrontal Pilates Studio</span><span class="header-line-2">Choose your practice</span></div><div id="practice-grid"></div></div></div></div>
<script>
const urlParams=new URLSearchParams(window.location.search),immediateAction=urlParams.get('action');const Studio={audioCtx:null,totalCycles:0,practices:[{d:'WORKING MEMORY',n:'Stargazer',s:'L',file:'Stargaizer.html'},{d:'SPATIAL WORKING MEMORY',n:'Sentinel',s:'R',file:'Sentinel.html'},{d:'EXECUTIVE MEMORY',n:'Align',s:'R',file:'#'},{d:'PROCESSING SPEED',n:'Bloom',s:'R',file:'#'},{d:'EPISODIC MEMORY',n:'Recall',s:'L',file:'#'},{d:'SPATIAL REASONING',n:'Rotate',s:'L',file:'#'},{d:'VERBAL FLUENCY',n:'Flow',s:'R',file:'#'},{d:'COMPLEX ATTENTION',n:'Filter',s:'L',file:'#'},{d:'ABSTRACT REASONING',n:'Decode',s:'L',file:'#'},{d:'COGNITIVE FLEXIBILITY',n:'Shift',s:'R',file:'#'}],initAudio(){if(!this.audioCtx)this.audioCtx=new(window.AudioContext||window.webkitAudioContext)()},playTone(freq,duration=3){this.initAudio();const osc=this.audioCtx.createOscillator(),gain=this.audioCtx.createGain();osc.type='sine';osc.frequency.setValueAtTime(freq,this.audioCtx.currentTime);gain.gain.setValueAtTime(0,this.audioCtx.currentTime);gain.gain.linearRampToValueAtTime(.15,this.audioCtx.currentTime+.5);gain.gain.exponentialRampToValueAtTime(.0001,this.audioCtx.currentTime+duration);osc.connect(gain);gain.connect(this.audioCtx.destination);osc.start();osc.stop(this.audioCtx.currentTime+duration)},showChoice(){document.getElementById('welcome-text').style.display='none';document.getElementById('mid-tier').innerHTML='<h1>Prepare your mind.</h1>';document.getElementById('bot-tier').innerHTML='<button class="studio-btn" style="width:auto;padding:10px 24px;margin:6px" onclick="Studio.revealDoors()">Start Practice</button><button class="studio-btn" style="width:auto;padding:10px 24px;margin:6px" onclick="Studio.selectCycles()">Take a Breather</button>'},selectCycles(){document.getElementById('welcome-text').style.display='none';document.getElementById('mid-tier').innerHTML='<div style="font-size:1.15rem;line-height:1.4;max-width:90%;margin:0 auto 40px">How many cycles of breath would you like to practice?</div>';document.getElementById('bot-tier').innerHTML='<button class="studio-btn" style="width:auto" onclick="Studio.beginWave(3)">3 Cycles</button><button class="studio-btn" style="width:auto" onclick="Studio.beginWave(5)">5 Cycles</button><button class="studio-btn" style="width:auto" onclick="Studio.beginWave(10)">10 Cycles</button>'},beginWave(count){this.totalCycles=count;this.runWave()},runWave(){const mid=document.getElementById('mid-tier');document.getElementById('bot-tier').innerHTML='';const phases=[{l:'Inhale',t:4000,f:342},{l:'Hold',t:4000,f:310},{l:'Exhale',t:8000,f:280}];let cycle=0,phase=0;const step=()=>{if(cycle>=this.totalCycles){this.revealDoors();return}const p=phases[phase];mid.innerHTML='<div style="font-size:.9rem;letter-spacing:3px;opacity:.6;margin-bottom:20px;text-transform:uppercase">CYCLE '+(cycle+1)+' OF '+this.totalCycles+'</div><div style="font-size:1.8rem">'+p.l+'</div>';this.playTone(p.f,p.t/1000);setTimeout(()=>{phase++;if(phase>=phases.length){phase=0;cycle++}step()},p.t)};step()},revealDoors(){document.body.classList.remove('cinematic-door-parting');document.body.classList.add('show-studio-grid');const grid=document.getElementById('practice-grid');grid.innerHTML='<div class="practice-door left"></div><div class="practice-door right"></div>';const left=grid.querySelector('.practice-door.left'),right=grid.querySelector('.practice-door.right');const rows=[['Stargazer','Sentinel'],['Recall','Align'],['Rotate','Bloom'],['Filter','Flow'],['Decode','Shift']];rows.forEach(pair=>pair.forEach((name,i)=>{const p=this.practices.find(x=>x.n===name);if(!p)return;const btn=document.createElement('button');btn.className='studio-btn';btn.onclick=e=>{e.stopPropagation();document.body.classList.add('cinematic-door-parting');setTimeout(()=>{if(p.file!=='#')window.location.href=p.file;else{document.body.classList.remove('cinematic-door-parting');}},1350)};btn.innerHTML='<div class="domain-tag">'+p.d+'</div><div style="font-size:.95rem;font-weight:700">'+p.n+'</div>';(i===0?left:right).appendChild(btn)}))}};if(immediateAction==='breather')Studio.selectCycles();else if(immediateAction==='studio')Studio.revealDoors();
</script></body></html>
