<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prefrontal Pilates Studio | Sanctuary Console</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400;1,700&display=swap" rel="stylesheet">
    <style>
        /* ==========================================================================
           UNIVERSAL SANCTUARY TYPOGRAPHY SYSTEM (Enforces Complete Visual Uniformity)
           ========================================================================== */
        * { 
            font-family: 'Playfair Display', serif !important; 
            font-style: italic !important; 
            font-weight: 400 !important; 
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        :root {
            --champagne-gold: #f7e7ce;
            --gold-alpha: rgba(247, 231, 206, 0.4);
            --amethyst-glass: rgba(25, 15, 35, 0.45);
            --luxury-bezier: cubic-bezier(0.645, 0.045, 0.355, 1.000);
        }

        body, html { margin: 0; padding: 0; background-color: #050706; overflow: hidden; width: 100%; height: 100%; }

        body, p, div, span, h1, h2, h3, button, li {
            color: var(--champagne-gold) !important;
            text-shadow: 0 0 1px rgba(247, 231, 206, 0.2);
        }

        #studio-stage { height: 100vh; width: 100vw; position: relative; overflow: hidden; }

        .ambient-backdrop {
            position: absolute; inset: 0; background-size: cover; background-position: center center;
            transition: opacity 1.2s var(--luxury-bezier);
        }
        #bg-garden { background-image: url('wisteria_path.jpg'); z-index: 1; }
        body.cinematic-door-parting #bg-garden { opacity: 0; }

        #bg-space-backing { background-image: url('star_gazer.jpeg'); z-index: 2; opacity: 0; visibility: hidden; }
        body.cinematic-door-parting #bg-space-backing { opacity: 1; visibility: visible; }

        /* UNIVERSAL CENTERED VIEWPORT CONTAINMENT MATRIX */
        .universal-viewport-box {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 480px; height: 75vh; z-index: 100;
            overflow: hidden; border-radius: 240px 240px 0 0;
            border: 2px solid rgba(247, 231, 206, 0.8); border-bottom: none;
            background: var(--amethyst-glass);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            transition: all 1.2s var(--luxury-bezier);
        }

        #main-archway { pointer-events: none !important; }
        #content-portal { z-index: 500; pointer-events: none; }

        .door-panel-wrapper {
            position: absolute; inset: 0; width: 100%; height: 100%;
            display: flex; flex-direction: row; justify-content: space-between; align-items: stretch;
        }

        .door { 
            width: 50%; height: 100%; z-index: 10; 
            transition: transform 1.4s var(--luxury-bezier); background: transparent;
            position: relative;
        }

        body.cinematic-door-parting #door-L { transform: translateX(-100%); }
        body.cinematic-door-parting #door-R { transform: translateX(100%); }
        body.cinematic-door-parting .universal-viewport-box { background: transparent; backdrop-filter: none; -webkit-backdrop-filter: none; border-color: rgba(247, 231, 206, 0.15); }

        body.show-studio-grid #portal-inner-home { display: none !important; }
        body.show-studio-grid #portal-inner-practice { display: flex !important; }

        .handle-rod {
            position: absolute; top: 130px; height: 250px; width: 1px;
            background: var(--champagne-gold); box-shadow: 0 0 15px var(--gold-alpha);
            z-index: 20; pointer-events: none; opacity: 0; visibility: hidden;
            transition: opacity 0.4s ease;
        }
        #handle-L { right: 0; } #handle-R { left: 0; }
        body.show-studio-grid .handle-rod { opacity: 1; visibility: visible; }
        body.cinematic-door-parting .handle-rod { opacity: 0; visibility: hidden; }

        .practice-column {
            width: 50%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            padding-top: 135px; padding-bottom: 40px; padding-left: 8px; padding-right: 8px;
            z-index: 9999 !important; pointer-events: auto !important; overflow-y: auto;
        }

        #portal-inner-home { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; width: 100%; text-align: center; pointer-events: auto !important; padding: 0 20px; }
        #portal-inner-practice { display: none; flex-direction: column; align-items: center; justify-content: flex-start; height: 100%; width: 100%; text-align: center; padding: 0 10px; }
        
        .panel-header { position: absolute; top: 20px; width: 90%; left: 5%; text-align: center; z-index: 9999 !important; pointer-events: none; }
        
        .header-line-1 { font-size: 1.4rem; margin-bottom: 4px; display: block; line-height: 1.2; font-weight: 700 !important; }
        .header-line-2 { font-size: 0.85rem; opacity: 0.85; display: block; letter-spacing: 2px; }
        .welcome-sub { font-size: 1.1rem; letter-spacing: 5px; width: 100%; white-space: nowrap; text-transform: capitalize; margin-bottom: 15px; }
        h1 { font-size: 1.8rem; margin: 0 0 25px 0; line-height: 1.15; font-weight: 700 !important; }

        .studio-btn {
            border: 1px solid var(--gold-alpha); border-radius: 40px; padding: 10px 15px; background: transparent; cursor: pointer !important; font-size: 0.8rem; transition: all 0.4s var(--luxury-bezier); display: inline-block; margin: 5px 0; outline: none; z-index: 9999 !important; pointer-events: auto !important; width: 100%; max-width: 190px; text-align: center;
        }
        .studio-btn:hover { border-color: var(--champagne-gold); background: rgba(247, 231, 206, 0.1); box-shadow: 0 0 15px rgba(247, 231, 206, 0.25); }
        .studio-btn:active { transform: scale(0.97); }
        .domain-tag { font-size: 0.55rem; text-transform: uppercase; letter-spacing: 1px; opacity: 0.6; margin-bottom: 3px; pointer-events: none; }

        @media (max-width: 480px) {
            #bg-garden { background-image: url('wisteria_mobile.jpeg') !important; }
            #bg-space-backing { background-image: url('star_gazer_mobile.jpeg') !important; }
        }
    </style>
</head>
<body>
<div id="studio-stage">
    <div id="bg-garden" class="ambient-backdrop"></div>
    <div id="bg-space-backing" class="ambient-backdrop"></div>
    
    <div id="main-archway" class="universal-viewport-box">
        <div class="door-panel-wrapper">
            <div id="door-L" class="door"><div id="handle-L" class="handle-rod"></div></div>
            <div id="door-R" class="door"><div id="handle-R" class="handle-rod"></div></div>
        </div>
    </div>
    
    <div id="content-portal" class="universal-viewport-box">
        <div id="portal-inner-home">
            <div id="top-tier"><div class="welcome-sub" id="welcome-text">Welcome to your</div></div>
            <div id="mid-tier"><h1>Prefrontal Pilates Studio</h1></div>
            <div id="bot-tier"><button class="studio-btn" id="start-btn" style="width:auto; padding:12px 40px;" onclick="Studio.showChoice()">BEGIN</button></div>
        </div>

        <div id="portal-inner-practice">
            <div class="panel-header">
                <button class="studio-btn" style="font-size: 0.85rem; padding: 6px 20px; margin-bottom: 12px; border-radius: 20px; width:auto;" onclick="window.location.href='index.html'">Exit Studio</button>
                <span class="header-line-1">Prefrontal Pilates Studio</span>
                <span class="header-line-2">Choose your practice</span>
            </div>
            <div class="door-panel-wrapper" style="pointer-events: none;">
                <div id="L-cont" class="practice-column"></div>
                <div id="R-cont" class="practice-column"></div>
            </div>
        </div>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const immediateAction = urlParams.get('action');

    const Studio = {
        audioCtx: null, totalCycles: 0,
        practices: [
            { d: "WORKING MEMORY", n: "Stargazer", s: "L", file: "Stargaizer.html" },
            { d: "EXECUTIVE MEMORY", n: "Align", s: "R", file: "#" },
            { d: "PROCESSING SPEED", n: "Bloom", s: "R", file: "#" },
            { d: "EPISODIC MEMORY", n: "Recall", s: "L", file: "#" },
            { d: "SPATIAL REASONING", n: "Rotate", s: "L", file: "#" },
            { d: "VERBAL FLUENCY", n: "Flow", s: "R", file: "#" },
            { d: "COMPLEX ATTENTION", n: "Filter", s: "L", file: "#" },
            { d: "ABSTRACT REASONING", n: "Decode", s: "R", file: "#" }
        ],
        initAudio() { if (!this.audioCtx) this.audioCtx = new (window.AudioContext || window.webkitAudioContext)(); },
        playTone(freq, duration = 3) {
            this.initAudio(); const osc = this.audioCtx.createOscillator(); const gain = this.audioCtx.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(freq, this.audioCtx.currentTime);
            gain.gain.setValueAtTime(0, this.audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0.15, this.audioCtx.currentTime + 0.5); gain.gain.exponentialRampToValueAtTime(0.0001, this.audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(this.audioCtx.destination); osc.start(); osc.stop(this.audioCtx.currentTime + duration);
        },
        // STREAMLINED CHOICE VIEW: Purged the redundant text paragraph and "now" layout strings
        showChoice() {
            document.getElementById('welcome-text').style.display = 'none';
            document.getElementById('mid-tier').innerHTML = `<h1>Prepare your mind.</h1>`;
            document.getElementById('bot-tier').innerHTML = `
                <button class="studio-btn" style="width:auto; padding:10px 24px; margin:6px;" onclick="Studio.revealDoors()">Start Practice</button>
                <button class="studio-btn" style="width:auto; padding:10px 24px; margin:6px;" onclick="Studio.selectCycles()">Take a Breather</button>
            `;
        },
        selectCycles() {
            document.getElementById('welcome-text').style.display = 'none';
            document.getElementById('mid-tier').innerHTML = `<div style="font-size: 1.15rem; line-height: 1.4; max-width: 90%; margin: 0 auto 40px auto;">How many cycles of breath would you like to practice?</div>`;
            document.getElementById('bot-tier').innerHTML = `<button class="studio-btn" style="width:auto;" onclick="Studio.beginWave(3)">3 Cycles</button><button class="studio-btn" style="width:auto;" onclick="Studio.beginWave(5)">5 Cycles</button><button class="studio-btn" style="width:auto;" onclick="Studio.beginWave(10)">10 Cycles</button>`;
        },
        beginWave(count) { this.totalCycles = count; this.runWave(); },
        runWave() {
            const mid = document.getElementById('mid-tier'); document.getElementById('bot-tier').innerHTML = '';
            const phases = [{ l: "Inhale", t: 4000, f: 342 }, { l: "Hold", t: 4000, f: 310 }, { l: "Exhale", t: 8000, f: 280 }];
            let cycle = 0, phase = 0;
            const step = () => {
                if (cycle >= this.totalCycles) { this.revealDoors(); return; }
                const p = phases[phase];
                mid.innerHTML = `<div style="font-size: 0.9rem; letter-spacing: 3px; opacity: 0.6; margin-bottom: 20px; text-transform: uppercase;">CYCLE ${cycle + 1} OF ${this.totalCycles}</div><div style="font-size: 1.8rem;">${p.l}</div>`;
                this.playTone(p.f, p.t/1000);
                setTimeout(() => { phase++; if (phase >= phases.length) { phase = 0; cycle++; } step(); }, p.t);
            };
            step();
        },
        revealDoors() {
            document.body.classList.add('show-studio-grid'); 
            const L_cont = document.getElementById('L-cont');
            const R_cont = document.getElementById('R-cont');
            L_cont.innerHTML = ''; R_cont.innerHTML = ''; 
            
            this.practices.forEach(p => {
                const btn = document.createElement('button');
                btn.className = 'studio-btn';
                btn.onclick = (e) => { 
                    e.stopPropagation(); 
                    if (p.file !== '#') {
                        document.body.classList.add('cinematic-door-parting');
                        setTimeout(() => { window.location.href = p.file; }, 1350);
                    }
                };
                btn.innerHTML = `<div class="domain-tag">${p.d}</div><div style="font-size:0.95rem; font-weight:700;">${p.n}</div>`;
                (p.s === 'L' ? L_cont : R_cont).appendChild(btn);
            });
        }
    };

    if (immediateAction === 'breather') Studio.selectCycles();
    else if (immediateAction === 'studio') Studio.revealDoors();
</script>
</body>
</html>
