<script>
const urlParams=new URLSearchParams(window.location.search),immediateAction=urlParams.get('action');const Studio={audioCtx:null,totalCycles:0,practices:[{d:'WORKING MEMORY',n:'Stargazer',s:'L',file:'Stargaizer.html?v=4e12b1ab'},{d:'SPATIAL WORKING MEMORY',n:'Sentinel',s:'R',file:'Sentinel.html?v=82643ab0'},{d:'EXECUTIVE MEMORY',n:'Align',s:'R',file:'#'},{d:'PROCESSING SPEED',n:'Bloom',s:'R',file:'#'},{d:'EPISODIC MEMORY',n:'Recall',s:'L',file:'#'},{d:'SPATIAL REASONING',n:'Rotate',s:'L',file:'#'},{d:'VERBAL FLUENCY',n:'Flow',s:'R',file:'#'},{d:'COMPLEX ATTENTION',n:'Filter',s:'L',file:'#'},{d:'ABSTRACT REASONING',n:'Decode',s:'L',file:'#'},{d:'COGNITIVE FLEXIBILITY',n:'Shift',s:'R',file:'#'}],initAudio(){if(!this.audioCtx)this.audioCtx=new(window.AudioContext||window.webkitAudioContext)()},playTone(freq,duration=3){this.initAudio();const osc=this.audioCtx.createOscillator(),gain=this.audioCtx.createGain();osc.type='sine';osc.frequency.setValueAtTime(freq,this.audioCtx.currentTime);gain.gain.setValueAtTime(0,this.audioCtx.currentTime);gain.gain.linearRampToValueAtTime(.15,this.audioCtx.currentTime+.5);gain.gain.exponentialRampToValueAtTime(.0001,this.audioCtx.currentTime+duration);osc.connect(gain);gain.connect(this.audioCtx.destination);osc.start();osc.stop(this.audioCtx.currentTime+duration)},enterStudio(){this.revealDoors()},openMyPlate(){const mid=document.getElementById('mid-tier'),bot=document.getElementById('bot-tier');document.getElementById('welcome-text').style.display='none';mid.innerHTML='<h1>MyPlate</h1><div class="orchard-tagline">You are what you eat.</div>';bot.className='orchard-menu';bot.innerHTML='<div style="font-size:.9rem;line-height:1.5;max-width:290px;margin:0 auto 8px">Nutrition intelligence is the next Neural Orchard module. This entrance is ready to connect to the MyPlate app without folding it into Prefrontal Pilates.</div><button class="studio-btn orchard-choice" onclick="window.location.href=\'index.html\'"><span class="choice-name">Return to Neural Orchard</span></button>'},selectCycles(){document.getElementById('welcome-text').style.display='none';document.getElementById('mid-tier').innerHTML='<div style="font-size:1.15rem;line-height:1.4;max-width:90%;margin:0 auto 40px">How many cycles of breath would you like to practice?</div>';document.getElementById('bot-tier').innerHTML='<button class="studio-btn" style="width:auto" onclick="Studio.beginWave(3)">3 Cycles</button><button class="studio-btn" style="width:auto" onclick="Studio.beginWave(5)">5 Cycles</button><button class="studio-btn" style="width:auto" onclick="Studio.beginWave(10)">10 Cycles</button>'},beginWave(count){this.totalCycles=count;this.runWave()},runWave(){const mid=document.getElementById('mid-tier');document.getElementById('bot-tier').innerHTML='';const phases=[{l:'Inhale',t:4000,f:342},{l:'Hold',t:4000,f:310},{l:'Exhale',t:8000,f:280}];let cycle=0,phase=0;const step=()=>{if(cycle>=this.totalCycles){this.revealDoors();return}const p=phases[phase];mid.innerHTML='<div style="font-size:.9rem;letter-spacing:3px;opacity:.6;margin-bottom:20px;text-transform:uppercase">CYCLE '+(cycle+1)+' OF '+this.totalCycles+'</div><div style="font-size:1.8rem">'+p.l+'</div>';this.playTone(p.f,p.t/1000);setTimeout(()=>{phase++;if(phase>=phases.length){phase=0;cycle++}step()},p.t)};step()},revealDoors(){document.body.classList.remove('cinematic-door-parting');document.body.classList.add('show-studio-grid');const grid=document.getElementById('practice-grid');grid.innerHTML='<div class="practice-door left"></div><div class="practice-door right"></div>';const left=grid.querySelector('.practice-door.left'),right=grid.querySelector('.practice-door.right');const rows=[['Stargazer','Sentinel'],['Recall','Align'],['Rotate','Bloom'],['Filter','Flow'],['Decode','Shift']];rows.forEach(pair=>pair.forEach((name,i)=>{const p=this.practices.find(x=>x.n===name);if(!p)return;const btn=document.createElement('button');btn.className='studio-btn';btn.onclick=e=>{e.stopPropagation();document.body.classList.toggle('sentinel-transition',p.n==='Sentinel');document.body.classList.add('cinematic-door-parting');setTimeout(()=>{if(p.file!=='#')window.location.href=p.file;else{document.body.classList.remove('cinematic-door-parting','sentinel-transition');}},1350)};btn.innerHTML='<div class="domain-tag">'+p.d+'</div><div style="font-size:.95rem;font-weight:700">'+p.n+'</div>';(i===0?left:right).appendChild(btn)}))}};if(immediateAction==='breather')Studio.selectCycles();else if(immediateAction==='studio')Studio.revealDoors();
</script></body></html>
