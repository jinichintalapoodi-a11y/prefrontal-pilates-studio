<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sentinel — Spatial Working Memory</title><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@1&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#160d06;color:#f7e7ce;font-family:'Playfair Display',serif;font-style:italic}.shell{width:100vw;height:100dvh;display:flex;align-items:center;justify-content:center;background:#160d06}.stage{position:relative;width:min(100vw,calc(100dvh*1.5));aspect-ratio:3/2;max-height:100dvh;overflow:hidden;background:url('sentinel_savanna_burrows.png?v=a79a4a5e') center/100% 100% no-repeat;box-shadow:0 0 60px #0008}.sentinel-wrap{position:absolute;z-index:5;transform:translate(-50%,-100%);overflow:hidden;pointer-events:none;opacity:0}.sentinel-wrap.rising{animation:rise .48s cubic-bezier(.2,.72,.25,1) forwards}.sentinel-wrap.hiding{animation:sink .42s ease-in forwards}@keyframes rise{0%{opacity:0;transform:translate(-50%,-58%) scale(.96)}35%{opacity:1}100%{opacity:1;transform:translate(-50%,-100%) scale(1)}}@keyframes sink{0%{opacity:1;transform:translate(-50%,-100%)}100%{opacity:0;transform:translate(-50%,-58%)}}.sentinel{position:absolute;left:50%;bottom:-34%;width:100%;height:auto;transform:translateX(-50%);filter:sepia(.22) saturate(.78) brightness(.78) contrast(1.08) drop-shadow(3px 5px 4px rgba(34,16,5,.35))}
.hud{position:fixed;z-index:30;top:max(14px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));right:max(14px,env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}.pill{pointer-events:auto;color:#f7e7ce;font:inherit;border:1px solid #f7e7ce88;background:#2b172bd9;backdrop-filter:blur(12px);border-radius:40px;padding:9px 16px}.readout{text-align:center;text-shadow:0 2px 10px #000;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;line-height:1.5}.match{position:absolute;z-index:25;left:50%;bottom:4.5%;transform:translateX(-50%);min-width:150px;font-size:18px;padding:12px 28px;opacity:0;pointer-events:none;transition:.2s}.playing .match{opacity:1;pointer-events:auto}.feedback{position:absolute;z-index:26;left:50%;top:17%;transform:translateX(-50%);font-size:19px;text-shadow:0 2px 12px #000;opacity:0;transition:.18s}.feedback.show{opacity:1}.veil{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:#1309074a;backdrop-filter:blur(2px)}.card{width:min(88%,510px);padding:30px 34px;text-align:center;border:1px solid #f7e7ce99;border-radius:28px;background:#2b172be8;box-shadow:0 22px 70px #0008}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;opacity:.72}.card h1{font-size:39px;font-weight:400;margin:7px 0 12px}.card p{font-size:16px;line-height:1.55;margin:0 auto 15px;max-width:410px}.example{font-size:14px;opacity:.76;margin-bottom:20px}.begin{font-size:17px;padding:11px 25px}.summary-row{display:flex;justify-content:center;gap:26px;margin:20px 0}.metric strong{display:block;font-size:26px;font-weight:400}.metric span{font-size:10px;letter-spacing:1px;text-transform:uppercase;opacity:.7}.rotate{display:none;position:fixed;inset:0;z-index:100;background:#171006;align-items:center;justify-content:center;text-align:center;padding:30px}@media(max-width:700px) and (orientation:portrait){.rotate{display:flex}}@media(max-height:500px){.pill{padding:6px 11px;font-size:12px}.readout{font-size:9px}.card{padding:18px 25px}.card h1{font-size:29px}}
</style></head><body><main class="shell"><section class="stage" id="stage"><div class="sentinel-wrap" id="sentinelWrap"><img class="sentinel" src="sentinel_meerkat.png?v=22f16ae0" alt="Sentinel meerkat"></div><div class="feedback" id="feedback"></div><button class="pill match" id="match">MATCH</button><div class="veil" id="veil"><div class="card" id="card"></div></div></section><div class="hud"><button class="pill" id="exit">Exit</button><div class="readout" id="readout">Sentinel<br>Watch 1 · Span 1</div><button class="pill" id="sound">Sound On</button></div></main><aside class="rotate">Rotate your phone to landscape to enter Sentinel.</aside><script>
const BURROWS={1:{x:18.9,y:63.4,w:5.4,h:14.5},2:{x:45.7,y:59.7,w:4.9,h:13.7},3:{x:85.8,y:61.9,w:5.3,h:14.3},4:{x:27,y:82,w:6.8,h:18},5:{x:79,y:78.9,w:6.6,h:17.7}};
const stage=document.getElementById('stage'),wrap=document.getElementById('sentinelWrap'),feedback=document.getElementById('feedback'),veil=document.getElementById('veil'),card=document.getElementById('card'),readout=document.getElementById('readout'),match=document.getElementById('match');
let watch=1,span=1,sequence=[],trial=0,targets=0,hits=0,falseAlarms=0,misses=0,responded=false,currentTarget=false,running=false,soundOn=true,timers=[];
const TRIALS=12;
function later(fn,ms){const t=setTimeout(fn,ms);timers.push(t);return t}function clearTimers(){timers.forEach(clearTimeout);timers=[]}
function tone(f=350,d=.09){if(!soundOn)return;const A=new(window.AudioContext||window.webkitAudioContext)(),o=A.createOscillator(),g=A.createGain();o.frequency.value=f;g.gain.setValueAtTime(.035,A.currentTime);g.gain.exponentialRampToValueAtTime(.001,A.currentTime+d);o.connect(g).connect(A.destination);o.start();o.stop(A.currentTime+d)}
function instruction(){const examples={1:'2 → 4 → 4',2:'2 → 4 → 2',3:'1 → 5 → 3 → 1'};const rules={1:'Compare each location with the previous appearance.',2:'Compare each location with two appearances ago.',3:'Compare each location with three appearances ago.'};card.innerHTML='<div class="eyebrow">Watch '+watch+' of 3 · Spatial Working Memory</div><h1>Sentinel</h1><p>'+rules[span]+' Press MATCH only when the locations are the same.</p><div class="example">Example: '+examples[span]+' · MATCH on the final location</div><button class="pill begin" id="begin">Begin Watch</button>';veil.style.display='flex';document.getElementById('begin').onclick=startWatch;readout.innerHTML='Sentinel<br>Watch '+watch+' · Span '+span}
function place(n){const p=BURROWS[n];wrap.style.left=p.x+'%';wrap.style.top=p.y+'%';wrap.style.width=p.w+'%';wrap.style.height=p.h+'%'}
function flash(t){feedback.textContent=t;feedback.classList.add('show');later(()=>feedback.classList.remove('show'),500)}
function choose(){if(sequence.length>span+1&&Math.random()<.34)return sequence[sequence.length-span];let n=1+Math.floor(Math.random()*5);if(sequence.length>=span&&n===sequence[sequence.length-span]&&Math.random()<.62)n=n%5+1;return n}
function nextTrial(){if(!running)return;if(trial>=TRIALS)return endWatch();wrap.className='sentinel-wrap';responded=false;later(()=>{const n=choose();currentTarget=sequence.length>=span&&n===sequence[sequence.length-span];if(currentTarget)targets++;sequence.push(n);place(n);void wrap.offsetWidth;wrap.classList.add('rising');trial++;readout.innerHTML='Sentinel<br>Watch '+watch+' · Span '+span+' · '+trial+'/'+TRIALS;later(()=>{if(currentTarget&&!responded)misses++;wrap.className='sentinel-wrap hiding';later(nextTrial,900)},1750)},650)}
function startWatch(){clearTimers();veil.style.display='none';stage.classList.add('playing');sequence=[];trial=targets=hits=falseAlarms=misses=0;running=true;nextTrial()}
match.onclick=()=>{if(!running||responded||!wrap.classList.contains('rising'))return;responded=true;if(currentTarget){hits++;tone(392);flash('Matched')}else{falseAlarms++;tone(278);flash('Keep watching')}};
function endWatch(){running=false;stage.classList.remove('playing');wrap.className='sentinel-wrap';const acc=targets?Math.round(hits/targets*100):100;const stable=hits>=Math.max(2,targets-1)&&falseAlarms<=1;if(watch<3){const nextSpan=stable?Math.min(3,span+1):span;card.innerHTML='<div class="eyebrow">Watch '+watch+' complete</div><h1>'+acc+'%</h1><p>'+hits+' correct match'+(hits===1?'':'es')+' · '+falseAlarms+' false alarm'+(falseAlarms===1?'':'s')+'.</p><div class="example">'+(stable?'Your watch was stable. The next rule reaches farther back.':'We’ll keep the same span for another watch.')+'</div><button class="pill begin" id="continue">Continue</button>';veil.style.display='flex';document.getElementById('continue').onclick=()=>{watch++;span=nextSpan;instruction()}}else summary(acc)}
function summary(acc){card.innerHTML='<div class="eyebrow">Sentinel complete</div><h1>Watch Summary</h1><div class="summary-row"><div class="metric"><strong>'+acc+'%</strong><span>Accuracy</span></div><div class="metric"><strong>'+hits+'</strong><span>Matches</span></div><div class="metric"><strong>'+falseAlarms+'</strong><span>False alarms</span></div></div><p>You finished three short watches. Your final spatial memory span was '+span+'.</p><button class="pill begin" id="again">Practice Again</button>';veil.style.display='flex';document.getElementById('again').onclick=()=>{watch=1;span=1;instruction()}}
document.getElementById('exit').onclick=()=>location.href='index.html?action=studio';document.getElementById('sound').onclick=function(){soundOn=!soundOn;this.textContent=soundOn?'Sound On':'Sound Off'};instruction();
</script></body></html>
