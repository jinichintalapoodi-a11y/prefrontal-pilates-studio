<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sentinel — Static Placement</title><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@1&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171006;color:#f7e7ce;font-family:'Playfair Display',serif;font-style:italic}.shell{position:relative;width:100vw;height:100dvh;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(ellipse at center,#382114 0,#171006 72%)}.stage{position:relative;width:min(100vw,calc(100dvh * 1.5));aspect-ratio:3/2;max-height:100dvh;overflow:hidden;background:url('sentinel_savanna_burrows.png?v=a79a4a5e') center/100% 100% no-repeat;box-shadow:0 0 55px rgba(0,0,0,.34)}.stage:after{content:'';position:absolute;inset:0;z-index:8;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.025),transparent 24%,transparent 86%,rgba(8,5,3,.055))}.sentinel{position:absolute;z-index:6;left:45.5%;top:56.9%;height:28%;width:auto;transform:translate(-50%,-72%);transform-origin:50% 100%;filter:drop-shadow(0 5px 7px rgba(22,10,3,.34));pointer-events:none}.hud{position:fixed;z-index:20;top:max(16px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));right:max(14px,env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:center;gap:12px;pointer-events:none}.pill{pointer-events:auto;color:#f7e7ce;font:inherit;border:1px solid rgba(247,231,206,.65);background:rgba(43,23,43,.88);backdrop-filter:blur(12px);border-radius:40px;padding:10px 17px}.status{text-align:center;font-size:12px;line-height:1.45;letter-spacing:1.5px;text-transform:uppercase;text-shadow:0 2px 10px #000;max-width:240px}.rotate-gate{display:none;position:fixed;inset:0;z-index:100;background:#171006 url('sentinel_savanna_burrows.png?v=a79a4a5e') center/cover no-repeat;align-items:center;justify-content:center;text-align:center;padding:34px}.rotate-gate:before{content:'';position:absolute;inset:0;background:rgba(20,10,14,.58);backdrop-filter:blur(5px)}.rotate-card{position:relative;z-index:1;width:min(88vw,390px);padding:34px 28px;border:1px solid rgba(247,231,206,.52);border-radius:30px;background:rgba(43,23,43,.82);box-shadow:0 18px 60px rgba(0,0,0,.35)}.rotate-icon{font-style:normal;font-size:42px;line-height:1;margin-bottom:18px}.rotate-title{font-size:28px;line-height:1.1;margin-bottom:12px}.rotate-copy{font-size:15px;line-height:1.55;opacity:.86}@media(max-width:700px) and (orientation:portrait){.rotate-gate{display:flex}}@media(max-height:500px) and (orientation:landscape){.hud{top:max(8px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right))}.pill{padding:7px 12px;font-size:13px}.status{font-size:9px;line-height:1.3;max-width:150px}}
</style></head><body><main class="shell"><section class="stage" aria-label="Sentinel savanna habitat"><img class="sentinel" src="sentinel_meerkat.png?v=22f16ae0" alt="Sentinel meerkat"></section><div class="hud"><button class="pill" id="exit">Exit</button><div class="status">Sentinel · Static Test<br>Burrow 2</div><button class="pill" id="sound">Sound On</button></div></main><aside class="rotate-gate" aria-label="Rotate device"><div class="rotate-card"><div class="rotate-icon" aria-hidden="true">↻</div><div class="rotate-title">Turn toward the horizon.</div><div class="rotate-copy">Rotate your phone to landscape to enter Sentinel.</div></div></aside><script>document.getElementById('exit').onclick=()=>location.href='index.html?action=studio';let soundOn=true;document.getElementById('sound').onclick=function(){soundOn=!soundOn;this.textContent=soundOn?'Sound On':'Sound Off'};</script></body></html>
