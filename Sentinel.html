<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Prefrontal Pilates Studio | Sentinel</title><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400;1,700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box;font-family:'Playfair Display',serif!important;font-style:italic!important} :root{--gold:#f7e7ce;--line:rgba(247,231,206,.55);--plum:rgba(31,18,35,.78);--ease:cubic-bezier(.645,.045,.355,1)}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#120e0a;color:var(--gold)}button{color:var(--gold)}
#stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:linear-gradient(#4b3b3a 0%,#b77a45 26%,#d9a154 45%,#74502d 64%,#211c13 100%)}
.skyglow{position:absolute;inset:0;background:radial-gradient(circle at 59% 36%,rgba(255,229,159,.94) 0 2%,rgba(255,190,96,.34) 10%,transparent 29%),linear-gradient(to bottom,rgba(18,16,18,.32),transparent 42%)}.mountain{position:absolute;left:-8%;bottom:39%;width:65%;height:32%;background:#47382f;opacity:.72;clip-path:polygon(0 100%,8% 70%,20% 62%,32% 23%,43% 8%,54% 19%,64% 55%,78% 76%,100% 100%)}.ridge{position:absolute;right:-10%;bottom:39%;width:58%;height:22%;background:#5b4431;opacity:.55;clip-path:polygon(0 100%,18% 63%,37% 70%,52% 37%,68% 56%,82% 24%,100% 45%,100% 100%)}
.acacia{position:absolute;right:5%;bottom:35%;width:290px;height:330px;opacity:.9}.acacia:before{content:'';position:absolute;left:143px;bottom:0;width:16px;height:255px;background:#241d17;transform:rotate(4deg);border-radius:50%}.acacia:after{content:'';position:absolute;left:15px;top:5px;width:260px;height:90px;border-radius:50%;background:#201f17;box-shadow:-40px 25px 0 -8px #201f17,55px 20px 0 -7px #201f17}
.savanna{position:absolute;left:0;right:0;bottom:0;height:48%;background:linear-gradient(to bottom,rgba(122,86,40,.35),rgba(31,28,17,.9)),repeating-linear-gradient(78deg,transparent 0 13px,rgba(222,171,80,.28) 14px 16px,transparent 17px 25px)}.haze{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 48%,rgba(17,16,12,.18) 68%,rgba(7,9,7,.55));pointer-events:none}
#field{position:absolute;inset:16% 4% 18%;z-index:10;max-width:1050px;margin:auto}.spot{position:absolute;width:1px;height:1px}.mound{position:absolute;left:50%;bottom:-8px;width:112px;height:38px;transform:translateX(-50%);border-radius:50% 50% 20% 20%;background:radial-gradient(ellipse at 50% 0,#56402a,#261f17 72%);opacity:.9;filter:drop-shadow(0 7px 7px rgba(0,0,0,.3))}
/* Contrast is intentionally controlled: the animal gets a quiet dark separation field, not a game-like outline. */.contrast-field{position:absolute;left:50%;bottom:0;width:118px;height:154px;transform:translate(-50%,25px) scale(.9);border-radius:48%;background:radial-gradient(ellipse,rgba(15,14,12,.44) 0 36%,rgba(15,14,12,.2) 55%,transparent 73%);opacity:0;transition:.32s ease}.sentinel{position:absolute;left:50%;bottom:2px;width:82px;height:138px;transform:translate(-50%,35px) scale(.9);opacity:0;transition:transform .44s var(--ease),opacity .28s;filter:drop-shadow(0 4px 2px rgba(0,0,0,.95)) drop-shadow(0 0 2px rgba(255,241,207,.65))}.spot.active .contrast-field{opacity:1;transform:translate(-50%,0) scale(.9)}.spot.active .sentinel{opacity:1;transform:translate(-50%,0) scale(.9)}
.tail{position:absolute;width:66px;height:12px;border-radius:80% 10% 80% 20%;background:#715943;left:48px;bottom:8px;transform:rotate(16deg);transform-origin:left}.body{position:absolute;width:46px;height:78px;border-radius:45% 48% 36% 38%;background:linear-gradient(90deg,#66513d,#b99b73 48%,#66513d);left:18px;bottom:12px}.belly{position:absolute;width:22px;height:58px;border-radius:50%;background:rgba(229,207,170,.42);left:12px;top:8px}.head{position:absolute;width:47px;height:42px;border-radius:48% 52% 43% 48%;background:linear-gradient(90deg,#6d5844,#c2a47c 57%,#6b5540);left:17px;bottom:84px}.ear{position:absolute;width:14px;height:17px;border-radius:50%;background:#4a382e;left:-4px;top:9px}.muzzle{position:absolute;width:24px;height:14px;border-radius:50%;background:#d0b58d;right:-8px;top:18px}.eye{position:absolute;width:6px;height:6px;border-radius:50%;background:#080808;right:8px;top:12px;box-shadow:0 0 0 4px rgba(45,30,25,.55)}.nose{position:absolute;width:6px;height:5px;border-radius:50%;background:#111;right:-8px;top:4px}.arm{position:absolute;width:7px;height:40px;border-radius:8px;background:#705943;top:27px}.arm.a{left:9px;transform:rotate(-7deg)}.arm.b{right:9px;transform:rotate(7deg)}
#hud{position:absolute;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:540px;padding:18px 20px;z-index:30;display:flex;justify-content:space-between;align-items:center;opacity:0;transition:.5s}.nav,.match,.level,.primary{border:1px solid var(--line);background:var(--plum);backdrop-filter:blur(14px);border-radius:40px;cursor:pointer;transition:.3s var(--ease)}.nav{padding:8px 17px;font-size:.84rem}.nav:hover,.match:hover,.level:hover,.primary:hover{border-color:var(--gold);background:rgba(247,231,206,.14);box-shadow:0 0 16px rgba(247,231,206,.22)}#status{text-align:center;font-size:.76rem;letter-spacing:2px;text-transform:uppercase;text-shadow:0 2px 10px #000}
#matchWrap{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);z-index:32}.match{width:210px;padding:14px 28px;font-size:1.08rem;letter-spacing:4px;text-transform:uppercase;opacity:0;pointer-events:none;box-shadow:0 7px 25px rgba(0,0,0,.35)}.match.live{opacity:1;pointer-events:auto}.match.hit{background:rgba(247,231,206,.17);box-shadow:0 0 30px rgba(247,231,206,.42)}
#gate{position:absolute;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:linear-gradient(transparent,rgba(5,7,6,.22))}.card{width:100%;max-width:480px;height:74vh;border:2px solid rgba(247,231,206,.8);border-bottom:0;border-radius:240px 240px 0 0;background:linear-gradient(rgba(8,7,7,.88),rgba(8,7,7,.92)),rgba(25,15,35,.42);backdrop-filter:blur(24px);padding:17vh 30px 28px;text-align:center;box-shadow:0 -15px 50px rgba(0,0,0,.7);overflow:auto}.title{font-size:1.48rem;font-weight:700!important;letter-spacing:2px;text-transform:uppercase;margin-bottom:14px}.desc{font-size:.96rem;line-height:1.65;max-width:370px;margin:0 auto 20px}.levels{display:flex;gap:9px;justify-content:center;margin:16px 0 21px}.level{width:55px;height:44px}.level.selected{border-color:var(--gold);background:rgba(247,231,206,.16)}.primary{padding:12px 29px;font-size:.96rem}.fine{font-size:.73rem;opacity:.68;letter-spacing:1px;margin-top:15px}.whisper{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);z-index:24;font-size:.9rem;letter-spacing:3px;text-shadow:0 2px 12px #000;opacity:0;transition:.5s}.whisper.show{opacity:.92}#summary{display:none}.metric{margin:8px 0}.metric strong{font-size:1.3rem}
@media(max-width:600px){.acacia{transform:scale(.68);transform-origin:right bottom}.card{height:82vh;padding-top:20vh}#field{inset:15% 2% 20%}.sentinel{transform:translate(-50%,35px) scale(.82)}.spot.active .sentinel{transform:translate(-50%,0) scale(.82)}.contrast-field{transform:translate(-50%,25px) scale(.82)}.spot.active .contrast-field{transform:translate(-50%,0) scale(.82)}.match{width:190px}}
</style></head><body><main id="stage"><div class="skyglow"></div><div class="mountain"></div><div class="ridge"></div><div class="acacia"></div><div class="savanna"></div><div class="haze"></div><div id="hud"><button class="nav" id="exit">Exit</button><div id="status"></div><button class="nav" id="sound">Sound On</button></div><div id="field"></div><div id="whisper" class="whisper"></div><div id="matchWrap"><button id="match" class="match">Match</button></div><section id="gate"><div class="card"><div id="intro"><div class="title">Welcome to Sentinel</div><p class="desc">Keep watch over the savanna. When the Sentinel appears in the same place as <span id="rule">the previous appearance</span>, choose Match. Let every other appearance pass.</p><div class="levels"><button class="level selected" data-n="1">I</button><button class="level" data-n="2">II</button><button class="level" data-n="3">III</button><button class="level" data-n="4">IV</button></div><button id="begin" class="primary">Begin Watch</button><div class="fine">Three short watches · quiet feedback · spatial working memory</div></div><div id="summary"><div class="title">Watch Complete</div><div class="metric">Accuracy<br><strong id="accuracy">—</strong></div><div class="metric">Correct matches<br><strong id="hits">—</strong></div><div class="metric">False alarms<br><strong id="falseAlarms">—</strong></div><p class="desc" id="reflection"></p><button id="return" class="primary">Return</button></div></div></section></main><script>
const G={n:1,seq:[],trials:[],i:0,hits:0,miss:0,fa:0,cr:0,responded:false,timer:null,sound:true,audio:null,ambientOsc:null,spots:[[12,55],[31,39],[50,59],[68,38],[84,58],[23,78],[58,79],[78,75]],per:12,watches:3,
initAudio(){if(!this.audio)this.audio=new(window.AudioContext||window.webkitAudioContext)();if(this.audio.state==='suspended')this.audio.resume()},tone(f,d=.18,v=.03){if(!this.sound)return;this.initAudio();const o=this.audio.createOscillator(),g=this.audio.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,this.audio.currentTime);g.gain.exponentialRampToValueAtTime(v,this.audio.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,this.audio.currentTime+d);o.connect(g);g.connect(this.audio.destination);o.start();o.stop(this.audio.currentTime+d)},rustle(){if(!this.sound)return;this.initAudio();const len=this.audio.sampleRate*.14,b=this.audio.createBuffer(1,len,this.audio.sampleRate),x=b.getChannelData(0);for(let j=0;j<len;j++)x[j]=(Math.random()*2-1)*(1-j/len);const s=this.audio.createBufferSource(),f=this.audio.createBiquadFilter(),g=this.audio.createGain();s.buffer=b;f.type='bandpass';f.frequency.value=1550;g.gain.value=.022;s.connect(f);f.connect(g);g.connect(this.audio.destination);s.start();this.tone(510,.12,.01)},ambient(){if(!this.sound||!this.audio||this.ambientOsc)return;const o=this.audio.createOscillator(),g=this.audio.createGain(),f=this.audio.createBiquadFilter();o.type='sine';o.frequency.value=72;f.type='lowpass';f.frequency.value=170;g.gain.value=.005;o.connect(f);f.connect(g);g.connect(this.audio.destination);o.start();this.ambientOsc=o},stopAmbient(){if(this.ambientOsc){try{this.ambientOsc.stop()}catch(e){}this.ambientOsc=null}},setN(n){this.n=n;document.querySelectorAll('.level').forEach(b=>b.classList.toggle('selected',+b.dataset.n===n));document.getElementById('rule').textContent=n===1?'the previous appearance':n===2?'two appearances ago':n===3?'three appearances ago':'four appearances ago'},build(){this.seq=[];const total=this.per*this.watches;for(let i=0;i<total;i++){const target=i>=this.n&&Math.random()<.28;let loc;if(target)loc=this.seq[i-this.n];else do{loc=Math.floor(Math.random()*this.spots.length)}while(i>=this.n&&loc===this.seq[i-this.n]);this.seq.push(loc)}this.trials=this.seq.map((loc,i)=>({loc,target:i>=this.n&&loc===this.seq[i-this.n]}))},render(){const f=document.getElementById('field');f.innerHTML='';this.spots.forEach((p,i)=>{const s=document.createElement('div');s.className='spot';s.id='spot'+i;s.style.left=p[0]+'%';s.style.top=p[1]+'%';s.innerHTML='<div class="mound"></div><div class="contrast-field"></div><div class="sentinel"><div class="tail"></div><div class="body"><div class="belly"></div><div class="arm a"></div><div class="arm b"></div></div><div class="head"><div class="ear"></div><div class="eye"></div><div class="muzzle"><div class="nose"></div></div></div></div>';f.appendChild(s)})},message(t){const w=document.getElementById('whisper');w.textContent=t;w.classList.add('show');setTimeout(()=>w.classList.remove('show'),900)},start(){this.initAudio();this.build();this.render();this.i=this.hits=this.miss=this.fa=this.cr=0;document.getElementById('gate').style.display='none';document.getElementById('hud').style.opacity=1;document.getElementById('match').classList.add('live');this.ambient();this.message('The watch begins');setTimeout(()=>this.next(),1200)},next(){if(this.i>=this.trials.length)return this.finish();if(this.i>0&&this.i%this.per===0){this.message('Watch '+(this.i/this.per+1)+' of '+this.watches);this.timer=setTimeout(()=>this.show(),1350)}else this.show()},show(){this.responded=false;const t=this.trials[this.i],spot=document.getElementById('spot'+t.loc);document.getElementById('status').textContent='Sentinel '+['I','II','III','IV'][this.n-1]+' · Watch '+(Math.floor(this.i/this.per)+1)+' of '+this.watches;this.rustle();spot.classList.add('active');setTimeout(()=>spot.classList.remove('active'),1120);this.timer=setTimeout(()=>{if(t.target&&!this.responded)this.miss++;else if(!t.target&&!this.responded)this.cr++;this.i++;this.next()},1800)},respond(){if(this.i>=this.trials.length||this.responded)return;this.responded=true;const t=this.trials[this.i],b=document.getElementById('match');if(t.target){this.hits++;this.tone(660,.27,.032);b.classList.add('hit');setTimeout(()=>b.classList.remove('hit'),300)}else{this.fa++;this.tone(230,.17,.015)}},finish(){clearTimeout(this.timer);this.stopAmbient();document.getElementById('match').classList.remove('live');document.getElementById('hud').style.opacity=0;document.getElementById('status').textContent='';const total=this.hits+this.miss+this.fa+this.cr,acc=Math.round((this.hits+this.cr)/Math.max(1,total)*100);document.getElementById('accuracy').textContent=acc+'%';document.getElementById('hits').textContent=this.hits;document.getElementById('falseAlarms').textContent=this.fa;document.getElementById('reflection').textContent=acc>=85?'Your watch was steady and precise.':acc>=70?'A strong watch. The next session will reward the same quiet concentration.':'This level asked a great deal of working memory. Stay with the level until it feels steadier.';document.getElementById('intro').style.display='none';document.getElementById('summary').style.display='block';document.getElementById('gate').style.display='flex'},reset(){document.getElementById('summary').style.display='none';document.getElementById('intro').style.display='block'},toggleSound(){this.sound=!this.sound;document.getElementById('sound').textContent=this.sound?'Sound On':'Sound Off';if(this.sound){this.initAudio();this.tone(420);this.ambient()}else this.stopAmbient()},exit(){this.stopAmbient();location.href='index.html?action=studio'}};
document.querySelectorAll('.level').forEach(b=>b.addEventListener('click',()=>G.setN(+b.dataset.n)));document.getElementById('begin').addEventListener('click',()=>G.start());document.getElementById('match').addEventListener('click',()=>G.respond());document.getElementById('sound').addEventListener('click',()=>G.toggleSound());document.getElementById('exit').addEventListener('click',()=>G.exit());document.getElementById('return').addEventListener('click',()=>G.reset());
</script></body></html>
