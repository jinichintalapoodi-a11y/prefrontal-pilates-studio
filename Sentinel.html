<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sentinel — Spatial Working Memory</title><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@1&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#160d06;color:#f7e7ce;font-family:'Playfair Display',serif;font-style:italic}.shell{width:100vw;height:100dvh;display:flex;align-items:center;justify-content:center;background:#160d06}.stage{position:relative;width:min(100vw,calc(100dvh*1.5));aspect-ratio:3/2;max-height:100dvh;overflow:hidden;background:url('sentinel_savanna_mounds.png?v=4f07ce05') center/100% 100% no-repeat;box-shadow:0 0 60px #0008}.sentinel-wrap{position:absolute;z-index:6;transform:translate(-50%,-100%);pointer-events:none;visibility:hidden;overflow:hidden;aspect-ratio:1/1.08}.sentinel-wrap.rising,.sentinel-wrap.hiding{visibility:visible}.sentinel{position:absolute;display:block;width:100%;height:auto;left:0;top:0;transform:translateY(var(--hidden,72%));will-change:transform}.sentinel-wrap.rising .sentinel{animation:emerge .72s cubic-bezier(.22,.61,.36,1) forwards}.sentinel-wrap.hiding .sentinel{animation:retreat .80s cubic-bezier(.4,0,.6,1) forwards}@keyframes emerge{0%{transform:translateY(var(--hidden,43%))}100%{transform:translateY(var(--shown,24%))}}@keyframes retreat{0%{transform:translateY(var(--shown,24%))}100%{transform:translateY(var(--hidden,43%))}}
.hud{position:fixed;z-index:30;top:max(14px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));right:max(14px,env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}.pill{pointer-events:auto;color:#f7e7ce;font:inherit;border:1px solid rgba(247,231,206,.72);background:rgba(247,231,206,.04);backdrop-filter:blur(10px);border-radius:40px;padding:9px 16px;box-shadow:0 0 0 1px rgba(247,231,206,.05) inset}.pill:hover{background:rgba(247,231,206,.10);border-color:#f7e7ce}.readout{text-align:center;text-shadow:0 2px 10px #000;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;line-height:1.5}.match{position:absolute;z-index:25;left:50%;bottom:4.5%;transform:translateX(-50%);min-width:150px;font-size:18px;padding:12px 28px;opacity:0;pointer-events:none;transition:.2s}.playing .match{opacity:1;pointer-events:auto}.feedback{position:absolute;z-index:26;left:50%;top:17%;transform:translateX(-50%);font-size:19px;text-shadow:0 2px 12px #000;opacity:0;transition:.18s}.feedback.show{opacity:1}.veil{position:absolute;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:#13090730;backdrop-filter:blur(1.5px)}.card{width:min(74vw,620px);min-height:min(74vh,700px);padding:86px 44px 46px;text-align:center;border:2px solid rgba(247,231,206,.72);border-bottom:none;border-radius:46% 46% 0 0/20% 20% 0 0;background:rgba(126,82,45,.42);backdrop-filter:blur(20px) saturate(.9);-webkit-backdrop-filter:blur(20px) saturate(.9);box-shadow:0 -18px 60px rgba(42,20,6,.22) inset;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;opacity:.82}.card h1{font-size:44px;font-weight:400;margin:12px 0 22px}.card p{font-size:18px;line-height:1.5;margin:0 auto 18px;max-width:430px}.example{font-size:15px;opacity:.8;margin-bottom:26px}.begin{font-size:17px;padding:11px 28px}.summary-row{display:none}.metric strong{display:block;font-size:26px;font-weight:400}.metric span{font-size:10px;letter-spacing:1px;text-transform:uppercase;opacity:.7}.rotate{display:none;position:fixed;inset:0;z-index:100;background:#171006;align-items:center;justify-content:center;text-align:center;padding:30px}@media(max-width:700px) and (orientation:portrait){.rotate{display:flex}}@media(max-height:500px){.pill{padding:6px 11px;font-size:12px}.readout{font-size:9px}.card{width:min(64vw,560px);min-height:84vh;padding:52px 30px 24px}.card h1{font-size:32px;margin:8px 0 14px}.card p{font-size:15px;line-height:1.4;margin-bottom:12px}.example{font-size:13px;margin-bottom:14px}}
</style></head><body><main class="shell"><section class="stage" id="stage"><div class="sentinel-wrap" id="sentinelWrap"><img class="sentinel" id="sentinelImg" src="sentinel_meerkat_upperbody.png?v=4cb7a0a9" alt="Sentinel meerkat"></div><div class="feedback" id="feedback"></div><button class="pill match" id="match">MATCH</button><div class="veil" id="veil"><div class="card" id="card"></div></div></section><div class="hud"><button class="pill" id="exit">Exit</button><div class="readout" id="readout">Sentinel<br>Level 1</div><button class="pill" id="sound">Sound On</button></div></main><aside class="rotate">Rotate your phone to landscape to enter Sentinel.</aside><script src="pps-session.js?v=62124007"></script><script>
const BURROWS={
1:{x:14.0,y:47.7,w:12.8,shown:29,hidden:72,clip:'polygon(0 0,100% 0,100% 96%,76% 98%,52% 100%,27% 98%,0 95%)'},
2:{x:49.0,y:51.2,w:13.8,shown:29,hidden:72,clip:'polygon(0 0,100% 0,100% 95%,76% 98%,50% 100%,24% 97%,0 94%)'},
3:{x:87.5,y:50.2,w:12.8,shown:29,hidden:72,clip:'polygon(0 0,100% 0,100% 94%,76% 97%,50% 100%,24% 98%,0 96%)'},
4:{x:20.5,y:65.8,w:14.8,shown:24,hidden:72,clip:'polygon(0 0,100% 0,100% 94%,78% 97%,52% 100%,27% 98%,0 95%)'},
5:{x:78.5,y:68.8,w:14.8,shown:24,hidden:72,clip:'polygon(0 0,100% 0,100% 96%,76% 99%,50% 100%,25% 97%,0 94%)'}
};
const stage=document.getElementById('stage'),wrap=document.getElementById('sentinelWrap'),sentinelImg=document.getElementById('sentinelImg'),feedback=document.getElementById('feedback'),veil=document.getElementById('veil'),card=document.getElementById('card'),readout=document.getElementById('readout'),match=document.getElementById('match');
const MAX_LEVEL=5,TARGET_MATCHES=5,MAX_TRIALS=30,CALIBRATE=parseInt(new URLSearchParams(location.search).get('calibrate')||'0',10);
let span=Math.min(MAX_LEVEL,Math.max(1,parseInt(localStorage.getItem('sentinelLevel')||'1',10))),sequence=[],trial=0,targets=0,hits=0,falseAlarms=0,misses=0,responded=false,currentTarget=false,running=false,soundOn=true,timers=[],sessionStartedAt=null,roundsAtLevel=0,music=null;
function later(fn,ms){const t=setTimeout(fn,ms);timers.push(t);return t}function clearTimers(){timers.forEach(clearTimeout);timers=[]}
function tone(f=350,d=.09){if(!soundOn)return;const A=new(window.AudioContext||window.webkitAudioContext)(),o=A.createOscillator(),g=A.createGain();o.frequency.value=f;g.gain.setValueAtTime(.035,A.currentTime);g.gain.exponentialRampToValueAtTime(.001,A.currentTime+d);o.connect(g).connect(A.destination);o.start();o.stop(A.currentTime+d)}
const MUSIC_SRC='yeahmusic-african-reggae-underscore-606601.mp3';
function ensureMusic(){if(!music){music=new Audio(MUSIC_SRC);music.loop=true;music.preload='auto';music.volume=.26}return music}
function startAmbient(){if(!soundOn)return;const a=ensureMusic();a.play().catch(()=>{})}
function playSentinelCall(){} // Reserved for a future separate emergence cue; no synthesized layer.
function stopAmbient(){if(music){music.pause()}}
function instruction(){const examples={1:'2 → 4 → 4 = MATCH',2:'2 → 4 → 2 = MATCH',3:'1 → 5 → 3 → 1 = MATCH',4:'2 → 5 → 1 → 4 → 2 = MATCH',5:'3 → 1 → 5 → 2 → 4 → 3 = MATCH'};const rules={1:'Tap MATCH when meerkat appears in the same burrow as last time.',2:'Tap MATCH when meerkat appears in the same burrow as 2 turns ago.',3:'Tap MATCH when meerkat appears in the same burrow as 3 turns ago.',4:'Tap MATCH when meerkat appears in the same burrow as 4 turns ago.',5:'Tap MATCH when meerkat appears in the same burrow as 5 turns ago.'};card.innerHTML='<h1>Sentinel</h1><p>'+rules[span]+'</p><div class="example">Example: '+examples[span]+'</div><button class="pill begin" id="begin">Begin</button><div class="eyebrow" style="margin-top:18px;letter-spacing:.8px;text-transform:none">Music: African Reggae Underscore — YeahMusic, via Pixabay</div>';veil.style.display='flex';document.getElementById('begin').onclick=()=>{tone(392,.16);startAmbient();startWatch()};readout.innerHTML='Sentinel<br>Level '+span}
function chooseEntry(){const saved=Math.min(MAX_LEVEL,Math.max(1,parseInt(localStorage.getItem('sentinelLevel')||'1',10)));span=saved;if(saved<=1){instruction();return}
card.innerHTML='<h1>Welcome back to Sentinel</h1><p>Would you like to pick up where you left off, or ease into it?</p><button class="pill begin" id="resume" style="margin:6px 0">Pick up at Level '+saved+'</button><button class="pill begin" id="ease" style="margin:6px 0">Ease in from Level 1</button>';veil.style.display='flex';readout.innerHTML='Sentinel<br>Welcome back';document.getElementById('resume').onclick=()=>{startAmbient();span=saved;instruction()};document.getElementById('ease').onclick=()=>{startAmbient();span=1;instruction()}}
function place(n){const p=BURROWS[n];wrap.style.left=p.x+'%';wrap.style.top=p.y+'%';wrap.style.width=p.w+'%';wrap.style.clipPath=p.clip;wrap.style.setProperty('--shown',p.shown+'%');wrap.style.setProperty('--hidden',p.hidden+'%')}
function flash(t){feedback.textContent=t;feedback.classList.add('show');later(()=>feedback.classList.remove('show'),500)}
function choose(){if(CALIBRATE>=1&&CALIBRATE<=5)return CALIBRATE;if(sequence.length>=span&&Math.random()<.38)return sequence[sequence.length-span];let n=1+Math.floor(Math.random()*5);if(sequence.length>=span&&n===sequence[sequence.length-span])n=n%5+1;return n}
function nextTrial(){if(!running)return;if(hits>=TARGET_MATCHES||trial>=MAX_TRIALS)return endWatch();wrap.className='sentinel-wrap';responded=false;later(()=>{const n=choose();currentTarget=CALIBRATE?false:(sequence.length>=span&&n===sequence[sequence.length-span]);if(currentTarget)targets++;sequence.push(n);place(n);trial++;readout.innerHTML='Sentinel<br>Level '+span;later(()=>{void wrap.offsetWidth;wrap.classList.add('rising');playSentinelCall()},120);later(()=>{if(currentTarget&&!responded)misses++;wrap.className='sentinel-wrap hiding';later(()=>{wrap.className='sentinel-wrap'},900);later(nextTrial,1280)},2150)},650)}
function startWatch(){clearTimers();if(!sessionStartedAt)sessionStartedAt=Date.now();startAmbient();veil.style.display='none';stage.classList.add('playing');sequence=[];trial=targets=hits=falseAlarms=misses=0;running=true;PPSDaily.start();nextTrial()}
match.onclick=()=>{if(!running||responded||!wrap.classList.contains('rising'))return;responded=true;if(currentTarget){hits++;tone(392);flash('Matched')}else{falseAlarms++;tone(278);flash('Keep watching')}};
function endWatch(){running=false;stage.classList.remove('playing');wrap.className='sentinel-wrap';PPSDaily.pause();
const errors=misses+falseAlarms,attempts=Math.max(1,trial-span),accuracy=Math.max(0,(attempts-errors)/attempts);
const ready=hits>=TARGET_MATCHES;
const finishLevel=()=>{if(ready&&span<MAX_LEVEL){const completed=span;span++;roundsAtLevel=0;localStorage.setItem('sentinelLevel',String(span));card.innerHTML='<div class="eyebrow">Level '+completed+'</div><h1>Beautiful focus.</h1><p>You found five matches.</p><div class="example">Ready for the next level.</div><button class="pill begin" id="continue">Continue</button>';veil.style.display='flex';document.getElementById('continue').onclick=instruction;return}
if(ready&&span===MAX_LEVEL){localStorage.setItem('sentinelLevel',String(span));return summary()}
roundsAtLevel++;card.innerHTML='<div class="eyebrow">Level '+span+'</div><h1>Stay with it.</h1><p>This level is still giving your memory a useful challenge.</p><div class="example">Continue when you’re ready.</div><button class="pill begin" id="continue">Continue</button>';veil.style.display='flex';document.getElementById('continue').onclick=instruction};
if(PPSDaily.naturalStop(finishLevel)){stopAmbient();veil.style.setProperty('display','none','important');veil.style.setProperty('visibility','hidden','important');veil.style.setProperty('pointer-events','none','important');stage.style.setProperty('z-index','0');return}finishLevel()}
function summary(){const mins=Math.max(1,Math.round((Date.now()-sessionStartedAt)/60000));card.innerHTML='<div class="eyebrow">Sentinel</div><h1>You showed up.</h1><p>You spent about '+mins+' minute'+(mins===1?'':'s')+' practicing focused spatial attention and memory.</p><div class="example">Your progress is saved. Next time, Sentinel will meet you where you left off.</div><button class="pill begin" id="again">Continue Practice</button>';veil.style.display='flex';document.getElementById('again').onclick=()=>{sessionStartedAt=null;instruction()}}
document.getElementById('exit').onclick=()=>{PPSDaily.pause();stopAmbient();running=false;clearTimers();stage.classList.remove('playing');wrap.className='sentinel-wrap';card.innerHTML='<h1>Brilliant.</h1><p>Do you want to?</p><button class="pill begin" id="exitStudio" style="margin:6px 0">Return to Prefrontal Pilates Studio</button><button class="pill begin" id="exitOrchard" style="margin:6px 0">Return to Neural Orchard</button>';veil.style.display='flex';veil.style.visibility='visible';veil.style.opacity='1';veil.style.pointerEvents='auto';card.style.display='flex';card.style.visibility='visible';card.style.opacity='1';document.getElementById('exitStudio').onclick=()=>location.href='index.html?action=studio';document.getElementById('exitOrchard').onclick=()=>location.href='index.html'};document.getElementById('sound').onclick=function(){soundOn=!soundOn;this.textContent=soundOn?'Sound On':'Sound Off';if(soundOn){startAmbient();tone(330,.12)}else stopAmbient()};chooseEntry();
</script></body></html>
