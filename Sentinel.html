<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sentinel — Spatial Working Memory</title><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@1&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#160d06;color:#f7e7ce;font-family:'Playfair Display',serif;font-style:italic}.shell{width:100vw;height:100dvh;display:flex;align-items:center;justify-content:center;background:#160d06}.stage{position:relative;width:min(100vw,calc(100dvh*1.5));aspect-ratio:3/2;max-height:100dvh;overflow:hidden;background:url('sentinel_savanna_burrows.png?v=a79a4a5e') center/100% 100% no-repeat;box-shadow:0 0 60px #0008}.stage:after{content:"";position:absolute;inset:0;z-index:12;pointer-events:none;background:linear-gradient(90deg,rgba(40,19,5,.08),transparent 55%,rgba(255,177,58,.055))}
.sentinel-wrap{position:absolute;z-index:5;transform:translate(-50%,-100%);overflow:hidden;pointer-events:none;opacity:0;transition:opacity .22s ease}.sentinel-wrap.up{opacity:1}.sentinel{position:absolute;left:50%;width:100%;height:auto;transform:translateX(-50%);transform-origin:50% 100%;filter:sepia(.32) saturate(.9) brightness(.76) contrast(1.12) drop-shadow(4px 5px 4px rgba(35,17,5,.42))}.sentinel-wrap:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(52,25,7,.26),rgba(72,35,9,.08) 48%,rgba(255,171,55,.18) 78%,rgba(255,211,125,.3));mix-blend-mode:soft-light}
.mouth{position:absolute;z-index:7;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;background:radial-gradient(ellipse,rgba(16,8,3,.84) 0 36%,rgba(48,25,9,.36) 54%,transparent 72%);opacity:0;transition:opacity .2s}.mouth.on{opacity:1}
.hud{position:fixed;z-index:30;top:max(14px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));right:max(14px,env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}.pill{pointer-events:auto;color:#f7e7ce;font:inherit;border:1px solid #f7e7ce88;background:#2b172bd9;backdrop-filter:blur(12px);border-radius:40px;padding:9px 16px}.readout{text-align:center;text-shadow:0 2px 10px #000;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;line-height:1.45}.match{position:absolute;z-index:25;left:50%;bottom:4.5%;transform:translateX(-50%);min-width:150px;font-size:18px;padding:12px 28px;opacity:0;pointer-events:none;transition:.25s}.playing .match{opacity:1;pointer-events:auto}.cardveil{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(19,9,7,.28);backdrop-filter:blur(2px)}.card{width:min(88%,500px);padding:32px 34px;text-align:center;border:1px solid #f7e7ce99;border-radius:28px;background:rgba(43,23,43,.88);box-shadow:0 22px 70px #0008}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;opacity:.72}.card h1{font-size:40px;font-weight:400;margin:8px 0 12px}.card p{font-size:16px;line-height:1.55;margin:0 auto 22px;max-width:390px}.card .example{font-size:14px;opacity:.76;margin:-6px 0 22px}.begin{font-size:17px;padding:11px 25px}.feedback{position:absolute;z-index:24;left:50%;top:18%;transform:translateX(-50%);font-size:18px;text-shadow:0 2px 12px #000;opacity:0;transition:.25s}.feedback.show{opacity:1}.rotate{display:none;position:fixed;inset:0;z-index:100;background:#171006;align-items:center;justify-content:center;text-align:center;padding:30px}@media(max-width:700px) and (orientation:portrait){.rotate{display:flex}}@media(max-height:500px){.pill{padding:6px 11px;font-size:12px}.readout{font-size:9px}.card{padding:20px 25px}.card h1{font-size:30px}}
</style></head><body><main class="shell"><section class="stage" id="stage" aria-label="Sentinel savanna habitat"><div class="mouth" id="mouth"></div><div class="sentinel-wrap" id="sentinelWrap"><img class="sentinel" id="sentinel" src="sentinel_meerkat.png?v=22f16ae0" alt="Sentinel meerkat"></div><div class="feedback" id="feedback"></div><button class="pill match" id="match">MATCH</button><div class="cardveil" id="veil"><div class="card"><div class="eyebrow">Spatial Working Memory</div><h1>Sentinel</h1><p id="rule">Watch where Sentinel appears. If the current location matches the previous appearance, press MATCH.</p><div class="example" id="example">Example: 2 → 4 → 4 &nbsp;·&nbsp; press MATCH on the second 4</div><button class="pill begin" id="begin">Begin Watch</button></div></div></section><div class="hud"><button class="pill" id="exit">Exit</button><div class="readout" id="readout">Sentinel<br>Span 1</div><button class="pill" id="sound">Sound On</button></div></main><aside class="rotate">Rotate your phone to landscape to enter Sentinel.</aside><script>
const BURROWS={
1:{x:18.9,y:63.4,w:5.6,h:15.2,b:-24,mw:8.0,mh:3.0},
2:{x:45.7,y:59.7,w:5.1,h:14.4,b:-24,mw:7.3,mh:2.8},
3:{x:85.8,y:61.9,w:5.5,h:15.0,b:-24,mw:8.0,mh:3.0},
4:{x:27.0,y:82.0,w:7.1,h:18.8,b:-28,mw:10.0,mh:3.8},
5:{x:79.0,y:78.9,w:6.9,h:18.5,b:-28,mw:9.8,mh:3.7}
};
const stage=document.getElementById('stage'),wrap=document.getElementById('sentinelWrap'),sentinel=document.getElementById('sentinel'),mouth=document.getElementById('mouth'),feedback=document.getElementById('feedback'),veil=document.getElementById('veil'),readout=document.getElementById('readout');
let span=1,seq=[],trial=0,correctTargets=0,falseAlarms=0,soundOn=true,open=false,currentTarget=false,timer;
function tone(freq=342,d=.08){if(!soundOn)return;const A=new (window.AudioContext||window.webkitAudioContext)(),o=A.createOscillator(),g=A.createGain();o.frequency.value=freq;g.gain.setValueAtTime(.045,A.currentTime);g.gain.exponentialRampToValueAtTime(.001,A.currentTime+d);o.connect(g).connect(A.destination);o.start();o.stop(A.currentTime+d)}
function place(n){const p=BURROWS[n];wrap.style.left=p.x+'%';wrap.style.top=p.y+'%';wrap.style.width=p.w+'%';wrap.style.height=p.h+'%';sentinel.style.bottom=p.b+'%';mouth.style.left=p.x+'%';mouth.style.top=p.y+'%';mouth.style.width=p.mw+'%';mouth.style.height=p.mh+'%'}
function next(){open=false;wrap.classList.remove('up');mouth.classList.remove('on');clearTimeout(timer);setTimeout(()=>{let n;if(trial>span+1&&Math.random()<.34)n=seq[seq.length-span];else n=1+Math.floor(Math.random()*5);seq.push(n);currentTarget=seq.length>span&&seq[seq.length-1]===seq[seq.length-1-span];place(n);wrap.classList.add('up');mouth.classList.add('on');open=true;trial++;timer=setTimeout(()=>{if(currentTarget)flash('Observe');wrap.classList.remove('up');mouth.classList.remove('on');setTimeout(next,700)},1900)},650)}
function flash(t){feedback.textContent=t;feedback.classList.add('show');setTimeout(()=>feedback.classList.remove('show'),550)}
document.getElementById('match').onclick=()=>{if(!open)return;if(currentTarget){correctTargets++;tone(392);flash('Matched')}else{falseAlarms++;tone(280);flash('Keep watching')}currentTarget=false};
document.getElementById('begin').onclick=()=>{veil.style.display='none';stage.classList.add('playing');next()};
document.getElementById('exit').onclick=()=>location.href='index.html?action=studio';
document.getElementById('sound').onclick=function(){soundOn=!soundOn;this.textContent=soundOn?'Sound On':'Sound Off'};
</script></body></html>
