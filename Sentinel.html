<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sentinel — Mound Test</title><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@1&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171006;color:#f7e7ce;font-family:'Playfair Display',serif;font-style:italic}.stage{--burrow-x:46.6%;--burrow-y:73.5%;position:relative;width:100vw;height:100dvh;overflow:hidden;background:url('sentinel_african_savanna.png') center/cover no-repeat}.stage:after{content:'';position:absolute;inset:0;z-index:8;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.04),transparent 24%,transparent 82%,rgba(8,5,3,.12))}.hud{position:absolute;z-index:20;top:max(16px,env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{color:#f7e7ce;font:inherit;border:1px solid rgba(247,231,206,.65);background:rgba(43,23,43,.88);backdrop-filter:blur(12px);border-radius:40px;padding:10px 17px}.status{text-align:center;font-size:12px;line-height:1.45;letter-spacing:1.5px;text-transform:uppercase;text-shadow:0 2px 10px #000;max-width:230px}
/* EMPTY MOUND PROTOTYPE. Sentinel intentionally removed while terrain is approved. */
.mound{position:absolute;z-index:5;left:var(--burrow-x);top:var(--burrow-y);width:clamp(190px,23vw,360px);height:clamp(76px,9vw,138px);transform:translate(-50%,-38%);pointer-events:none}.mound-soil{position:absolute;inset:12% 0 0;border-radius:48% 52% 43% 57%/72% 67% 33% 28%;background:radial-gradient(ellipse at 48% 26%,rgba(104,61,20,.78) 0 16%,rgba(126,77,27,.58) 34%,rgba(103,60,18,.46) 53%,rgba(74,42,13,.25) 68%,transparent 78%);filter:blur(.35px);transform:rotate(-1deg)}.mound-soil:before{content:'';position:absolute;left:5%;right:7%;bottom:4%;height:42%;border-radius:50%;background:radial-gradient(ellipse,rgba(75,42,12,.28),rgba(116,70,23,.16) 46%,transparent 72%);transform:rotate(2deg)}.opening{position:absolute;z-index:2;left:50%;top:20%;width:45%;height:30%;transform:translateX(-50%);border-radius:48% 52% 51% 49%/54% 49% 51% 46%;background:radial-gradient(ellipse at 50% 54%,rgba(12,8,4,.96) 0 45%,rgba(37,22,8,.92) 57%,rgba(76,43,13,.58) 72%,transparent 79%);box-shadow:inset 0 6px 9px rgba(0,0,0,.48)}.front-bank{position:absolute;z-index:3;left:7%;right:5%;top:37%;height:51%;border-radius:46% 54% 50% 50%/54% 58% 42% 46%;background:radial-gradient(ellipse at 48% 5%,rgba(119,70,22,.68),rgba(101,57,17,.48) 35%,rgba(79,44,13,.28) 61%,transparent 78%);transform:rotate(.7deg)}.front-bank:before,.front-bank:after{content:'';position:absolute;border-radius:50%;background:rgba(92,51,15,.25);filter:blur(.4px)}.front-bank:before{width:31%;height:34%;left:5%;top:28%;transform:rotate(-8deg)}.front-bank:after{width:27%;height:29%;right:8%;top:21%;transform:rotate(9deg)}.mound-grass{position:absolute;z-index:4;left:-5%;right:-5%;bottom:4%;height:40%;background:repeating-linear-gradient(76deg,transparent 0 10px,rgba(126,79,27,.18) 11px 12px,transparent 13px 20px);mask-image:linear-gradient(to top,#000,transparent 92%);opacity:.7}
@media(max-width:600px){.hud{left:10px;right:10px}.pill{padding:9px 14px}.status{font-size:10px;max-width:165px}.mound{width:clamp(190px,48vw,270px);height:clamp(78px,20vw,112px)}}
</style></head><body><main class="stage"><div class="hud"><button class="pill" id="exit">Exit</button><div class="status">Sentinel · Mound Test<br>Empty Burrow Only</div><button class="pill" id="sound">Sound On</button></div><div class="mound" aria-hidden="true"><div class="mound-soil"></div><div class="opening"></div><div class="front-bank"></div><div class="mound-grass"></div></div></main><script>document.getElementById('exit').onclick=()=>location.href='index.html?action=studio';let soundOn=true;document.getElementById('sound').onclick=function(){soundOn=!soundOn;this.textContent=soundOn?'Sound On':'Sound Off'};</script></body></html>
