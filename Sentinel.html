<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sentinel — Spatial Working Memory</title><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@1&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#160d06;color:#f7e7ce;font-family:'Playfair Display',serif;font-style:italic}.shell{width:100vw;height:100dvh;display:flex;align-items:center;justify-content:center;background:#160d06}.stage{position:relative;width:min(100vw,calc(100dvh*1.5));aspect-ratio:3/2;max-height:100dvh;overflow:hidden;background:url('sentinel_savanna_burrows.png?v=a79a4a5e') center/100% 100% no-repeat;box-shadow:0 0 60px #0008}.burrow-anchor{position:absolute;z-index:4;transform:translate(-50%,-50%);pointer-events:none;opacity:0;transition:opacity .18s ease}.burrow-anchor.on{opacity:1}.burrow-shadow{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:100%;height:100%;border-radius:50%;background:radial-gradient(ellipse at 50% 45%,rgba(14,7,2,.9) 0 34%,rgba(41,22,8,.66) 50%,rgba(111,71,31,.22) 68%,transparent 76%);filter:blur(.2px)}.burrow-lip{position:absolute;z-index:6;left:50%;top:58%;transform:translate(-50%,-50%);width:112%;height:58%;border-radius:50%;background:linear-gradient(180deg,rgba(154,104,54,.08),rgba(95,56,24,.58) 45%,rgba(56,31,12,.72) 100%);box-shadow:0 -2px 5px rgba(235,174,92,.08) inset,0 2px 5px rgba(25,12,4,.28);clip-path:ellipse(50% 28% at 50% 55%)}.sentinel-wrap{position:absolute;z-index:5;transform:translate(-50%,-100%);overflow:hidden;pointer-events:none;opacity:0}.sentinel-wrap.rising{animation:rise .48s cubic-bezier(.2,.72,.25,1) forwards}.sentinel-wrap.hiding{animation:sink .42s ease-in forwards}@keyframes rise{0%{opacity:0;transform:translate(-50%,-58%) scale(.96)}35%{opacity:1}100%{opacity:1;transform:translate(-50%,-100%) scale(1)}}@keyframes sink{0%{opacity:1;transform:translate(-50%,-100%)}100%{opacity:0;transform:translate(-50%,-58%)}}.sentinel{position:absolute;left:50%;bottom:-34%;width:100%;height:auto;transform:translateX(-50%);filter:sepia(.22) saturate(.78) brightness(.78) contrast(1.08) drop-shadow(3px 5px 4px rgba(34,16,5,.35))}
.hud{position:fixed;z-index:30;top:max(14px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));right:max(14px,env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}.pill{pointer-events:auto;color:#f7e7ce;font:inherit;border:1px solid rgba(247,231,206,.72);background:rgba(247,231,206,.04);backdrop-filter:blur(10px);border-radius:40px;padding:9px 16px;box-shadow:0 0 0 1px rgba(247,231,206,.05) inset}.pill:hover{background:rgba(247,231,206,.10);border-color:#f7e7ce}.readout{text-align:center;text-shadow:0 2px 10px #000;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;line-height:1.5}.match{position:absolute;z-index:25;left:50%;bottom:4.5%;transform:translateX(-50%);min-width:150px;font-size:18px;padding:12px 28px;opacity:0;pointer-events:none;transition:.2s}.playing .match{opacity:1;pointer-events:auto}.feedback{position:absolute;z-index:26;left:50%;top:17%;transform:translateX(-50%);font-size:19px;text-shadow:0 2px 12px #000;opacity:0;transition:.18s}.feedback.show{opacity:1}.veil{position:absolute;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:#13090730;backdrop-filter:blur(1.5px)}.card{width:min(74vw,620px);min-height:min(74vh,700px);padding:86px 44px 46px;text-align:center;border:2px solid rgba(247,231,206,.72);border-bottom:none;border-radius:46% 46% 0 0/20% 20% 0 0;background:rgba(126,82,45,.42);backdrop-filter:blur(20px) saturate(.9);-webkit-backdrop-filter:blur(20px) saturate(.9);box-shadow:0 -18px 60px rgba(42,20,6,.22) inset;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;opacity:.82}.card h1{font-size:44px;font-weight:400;margin:12px 0 22px}.card p{font-size:18px;line-height:1.5;margin:0 auto 18px;max-width:430px}.example{font-size:15px;opacity:.8;margin-bottom:26px}.begin{font-size:17px;padding:11px 28px}.summary-row{display:none}.metric strong{display:block;font-size:26px;font-weight:400}.metric span{font-size:10px;letter-spacing:1px;text-transform:uppercase;opacity:.7}.rotate{display:none;position:fixed;inset:0;z-index:100;background:#171006;align-items:center;justify-content:center;text-align:center;padding:30px}@media(max-width:700px) and (orientation:portrait){.rotate{display:flex}}@media(max-height:500px){.pill{padding:6px 11px;font-size:12px}.readout{font-size:9px}.card{width:min(64vw,560px);min-height:84vh;padding:52px 30px 24px}.card h1{font-size:32px;margin:8px 0 14px}.card p{font-size:15px;line-height:1.4;margin-bottom:12px}.example{font-size:13px;margin-bottom:14px}}
</style></head><body><main class="shell"><section class="stage" id="stage"><div class="burrow-anchor" id="burrowAnchor"><div class="burrow-shadow"></div><div class="burrow-lip"></div></div><div class="sentinel-wrap" id="sentinelWrap"><img class="sentinel" src="sentinel_meerkat.png?v=22f16ae0" alt="Sentinel meerkat"></div><div class="feedback" id="feedback"></div><button class="pill match" id="match">MATCH</button><div class="veil" id="veil"><div class="card" id="card"></div></div></section><div class="hud"><button class="pill" id="exit">Exit</button><div class="readout" id="readout">Sentinel<br>Watch 1 · Span 1</div><button class="pill" id="sound">Sound On</button></div></main><aside class="rotate">Rotate your phone to landscape to enter Sentinel.</aside><script>
const BURROWS={1:{x:18.9,y:63.4,w:5.4,h:14.5},2:{x:45.7,y:59.7,w:4.9,h:13.7},3:{x:85.8,y:61.9,w:5.3,h:14.3},4:{x:27,y:82,w:6.8,h:18},5:{x:79,y:78.9,w:6.6,h:17.7}};
const stage=document.getElementById('stage'),wrap=document.getElementById('sentinelWrap'),anchor=document.getElementById('burrowAnchor'),feedback=document.getElementById('feedback'),veil=document.getElementById('veil'),card=document.getElementById('card'),readout=document.getElementById('readout'),match=document.getElementById('match');
let watch=1,span=1,sequence=[],trial=0,targets=0,hits=0,falseAlarms=0,misses=0,responded=false,currentTarget=false,running=false,soundOn=true,timers=[],sessionStartedAt=null;
const TRIALS=12;
function later(fn,ms){const t=setTimeout(fn,ms);timers.push(t);return t}function clearTimers(){timers.forEach(clearTimeout);timers=[]}
function tone(f=350,d=.09){if(!soundOn)return;const A=new(window.AudioContext||window.webkitAudioContext)(),o=A.createOscillator(),g=A.createGain();o.frequency.value=f;g.gain.setValueAtTime(.035,A.currentTime);g.gain.exponentialRampToValueAtTime(.001,A.currentTime+d);o.connect(g).connect(A.destination);o.start();o.stop(A.currentTime+d)}
function instruction(){const examples={1:'2 → 4 → 4 = MATCH',2:'2 → 4 → 2 = MATCH',3:'1 → 5 → 3 → 1 = MATCH'};const rules={1:'Watch where Sentinel appears. Tap MATCH if she appears in the same burrow as last time.',2:'Watch where Sentinel appears. Tap MATCH if she appears in the same burrow as 2 turns ago.',3:'Watch where Sentinel appears. Tap MATCH if she appears in the same burrow as 3 turns ago.'};card.innerHTML='<div class="eyebrow">Level '+span+' · Spatial Working Memory</div><h1>Sentinel</h1><p>'+rules[span]+'</p><div class="example">Example: '+examples[span]+'</div><button class="pill begin" id="begin">Begin</button>';veil.style.display='flex';document.getElementById('begin').onclick=startWatch;readout.innerHTML='Sentinel<br>Level '+span}
function place(n){const p=BURROWS[n];wrap.style.left=p.x+'%';wrap.style.top=p.y+'%';wrap.style.width=p.w+'%';wrap.style.height=p.h+'%';anchor.style.left=p.x+'%';anchor.style.top=p.y+'%';anchor.style.width=(p.w*1.34)+'%';anchor.style.height=(p.h*.24)+'%'}
function flash(t){feedback.textContent=t;feedback.classList.add('show');later(()=>feedback.classList.remove('show'),500)}
function choose(){if(sequence.length>span+1&&Math.random()<.34)return sequence[sequence.length-span];let n=1+Math.floor(Math.random()*5);if(sequence.length>=span&&n===sequence[sequence.length-span]&&Math.random()<.62)n=n%5+1;return n}
function nextTrial(){if(!running)return;if(trial>=TRIALS)return endWatch();wrap.className='sentinel-wrap';anchor.className='burrow-anchor';responded=false;later(()=>{const n=choose();currentTarget=sequence.length>=span&&n===sequence[sequence.length-span];if(currentTarget)targets++;sequence.push(n);place(n);anchor.classList.add('on');void wrap.offsetWidth;wrap.classList.add('rising');trial++;readout.innerHTML='Sentinel<br>Level '+span+' · '+trial+'/'+TRIALS;later(()=>{if(currentTarget&&!responded)misses++;wrap.className='sentinel-wrap hiding';later(()=>anchor.className='burrow-anchor',260);later(nextTrial,900)},1750)},650)}
function startWatch(){clearTimers();if(!sessionStartedAt)sessionStartedAt=Date.now();veil.style.display='none';stage.classList.add('playing');sequence=[];trial=targets=hits=falseAlarms=misses=0;running=true;nextTrial()}
match.onclick=()=>{if(!running||responded||!wrap.classList.contains('rising'))return;responded=true;if(currentTarget){hits++;tone(392);flash('Matched')}else{falseAlarms++;tone(278);flash('Keep watching')}};
function endWatch(){running=false;stage.classList.remove('playing');wrap.className='sentinel-wrap';anchor.className='burrow-anchor';
const opportunities=Math.max(1,targets+(TRIALS-targets));const errors=misses+falseAlarms;const accuracy=(TRIALS-errors)/TRIALS;
const stable=accuracy>=.80&&hits>=Math.max(2,Math.ceil(targets*.7))&&falseAlarms<=1;
if(watch<3){const nextSpan=stable?Math.min(3,span+1):span;card.innerHTML='<div class="eyebrow">Practice complete</div><h1>Well done.</h1><p>You stayed with the pattern and gave your attention to the task.</p><div class="example">Take a breath. When you’re ready, continue.</div><button class="pill begin" id="continue">Continue</button>';veil.style.display='flex';document.getElementById('continue').onclick=()=>{watch++;span=nextSpan;instruction()}}else summary()}
function summary(){const mins=Math.max(1,Math.round((Date.now()-sessionStartedAt)/60000));card.innerHTML='<div class="eyebrow">Sentinel complete</div><h1>You showed up.</h1><p>You spent about '+mins+' minute'+(mins===1?'':'s')+' practicing focused spatial attention and memory.</p><div class="example">That practice counts. Return when you’re ready to strengthen it again.</div><button class="pill begin" id="again">Practice Again</button>';veil.style.display='flex';document.getElementById('again').onclick=()=>{watch=1;span=1;sessionStartedAt=null;instruction()}}
document.getElementById('exit').onclick=()=>location.href='index.html?action=studio';document.getElementById('sound').onclick=function(){soundOn=!soundOn;this.textContent=soundOn?'Sound On':'Sound Off'};instruction();
</script></body></html>
