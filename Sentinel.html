<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Prefrontal Pilates Studio | Sentinel</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400;1,700&display=swap" rel="stylesheet">
<style>
*{font-family:'Playfair Display',serif!important;font-style:italic!important;font-weight:400!important;box-sizing:border-box;-webkit-font-smoothing:antialiased} :root{--gold:#f7e7ce;--ga:rgba(247,231,206,.55);--glass:rgba(25,15,35,.38);--ease:cubic-bezier(.645,.045,.355,1)} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171a12;color:var(--gold)} button{color:var(--gold)}
#stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:linear-gradient(to bottom,#7f8790 0%,#c5a778 31%,#7d6c45 55%,#343b25 100%)}
#sun{position:absolute;width:22vw;height:22vw;max-width:260px;max-height:260px;border-radius:50%;right:11%;top:11%;background:rgba(255,224,167,.5);filter:blur(2px);box-shadow:0 0 80px rgba(255,200,120,.25)}
#haze{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(25,22,18,.05),rgba(50,38,22,.04) 48%,rgba(8,13,8,.42));pointer-events:none}
.hill{position:absolute;left:-10%;width:120%;border-radius:50% 50% 0 0/100% 100% 0 0}.far{height:28%;bottom:28%;background:#676545;opacity:.55}.near{height:30%;bottom:-7%;background:#303a24}
.acacia{position:absolute;bottom:31%;left:11%;width:180px;height:190px;opacity:.62}.acacia:before{content:'';position:absolute;left:84px;bottom:0;width:9px;height:145px;background:#30281d;transform:rotate(-4deg)}.acacia:after{content:'';position:absolute;left:10px;top:6px;width:170px;height:58px;border-radius:50%;background:#343b25;box-shadow:35px 12px 0 #343b25,-20px 18px 0 #343b25}
.grass{position:absolute;inset:auto 0 0;height:38%;opacity:.75;background:repeating-linear-gradient(78deg,transparent 0 16px,rgba(171,146,83,.26) 17px 19px,transparent 20px 29px)}
#hud{position:absolute;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:20px;z-index:30;display:flex;justify-content:space-between;opacity:0;transition:.5s}.nav,.match,.level-btn,.primary{border:1px solid var(--ga);background:rgba(25,15,35,.42);backdrop-filter:blur(12px);border-radius:40px;padding:8px 19px;cursor:pointer;transition:.3s var(--ease)}.nav:hover,.match:hover,.level-btn:hover,.primary:hover{border-color:var(--gold);background:rgba(247,231,206,.12);box-shadow:0 0 15px rgba(247,231,206,.2)}
#status{position:absolute;top:25px;left:50%;transform:translateX(-50%);z-index:25;font-size:.78rem;letter-spacing:2px;text-transform:uppercase;opacity:.8}
#field{position:absolute;inset:12% 5% 19%;z-index:10;max-width:980px;margin:auto}.spot{position:absolute;width:1px;height:1px}.sentinel{position:absolute;left:50%;bottom:0;width:74px;height:126px;transform:translate(-50%,35px) scale(.88);opacity:0;transition:transform .42s var(--ease),opacity .3s ease;filter:drop-shadow(0 8px 7px rgba(0,0,0,.38))}.sentinel.up{opacity:1;transform:translate(-50%,0) scale(.88)}
/* restrained naturalistic vector sentinel */.tail{position:absolute;width:58px;height:12px;border-radius:80% 10% 80% 20%;background:#6d5942;left:43px;bottom:8px;transform:rotate(18deg);transform-origin:left}.body{position:absolute;width:42px;height:73px;border-radius:45% 48% 36% 38%;background:linear-gradient(90deg,#756047,#a88c68 48%,#6c5841);left:17px;bottom:11px}.chest{position:absolute;width:21px;height:55px;border-radius:50%;background:rgba(205,179,137,.38);left:11px;top:9px}.head{position:absolute;width:43px;height:39px;border-radius:48% 52% 43% 48%;background:linear-gradient(90deg,#766048,#a78c6a 58%,#6d5942);left:16px;bottom:77px}.ear{position:absolute;width:13px;height:16px;border-radius:50%;background:#554537;left:-4px;top:8px}.muzzle{position:absolute;width:22px;height:13px;border-radius:50%;background:#c0a783;right:-7px;top:17px;transform:rotate(-4deg)}.eye{position:absolute;width:5px;height:5px;border-radius:50%;background:#111;right:8px;top:11px;box-shadow:0 0 0 3px rgba(57,43,32,.4)}.nose{position:absolute;width:5px;height:4px;border-radius:50%;background:#171513;right:-7px;top:4px}.arm{position:absolute;width:7px;height:38px;border-radius:8px;background:#765f47;top:25px}.arm.a{left:8px;transform:rotate(-8deg)}.arm.b{right:8px;transform:rotate(8deg)}
#match-wrap{position:absolute;bottom:5.5%;left:50%;transform:translateX(-50%);z-index:30;text-align:center}.match{width:190px;padding:13px 25px;font-size:1rem;letter-spacing:3px;text-transform:uppercase;opacity:0;pointer-events:none}.match.live{opacity:1;pointer-events:auto}.match.hit{box-shadow:0 0 28px rgba(247,231,206,.45);background:rgba(247,231,206,.13)}
#gate{position:absolute;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,7,6,.1)}.card{width:100%;max-width:480px;height:74vh;border:2px solid rgba(247,231,206,.8);border-bottom:none;border-radius:240px 240px 0 0;background:linear-gradient(rgba(5,7,6,.88),rgba(5,7,6,.88)),var(--glass);backdrop-filter:blur(25px);padding:18vh 30px 30px;text-align:center;box-shadow:0 -15px 50px rgba(0,0,0,.65);overflow:auto}.title{font-size:1.5rem;font-weight:700!important;letter-spacing:2px;text-transform:uppercase;margin-bottom:16px}.desc{font-size:.95rem;line-height:1.65;opacity:.94;margin:0 auto 22px;max-width:360px}.levels{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:15px 0 22px}.level-btn{width:54px;height:42px;padding:0}.level-btn.selected{background:rgba(247,231,206,.16);border-color:var(--gold)}.primary{padding:11px 28px;font-size:.95rem;letter-spacing:1px}.fine{font-size:.72rem;opacity:.6;letter-spacing:1px;margin-top:16px}
#summary{display:none}.metric{margin:9px 0;font-size:1rem}.metric strong{font-weight:700!important;font-size:1.3rem}.whisper{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:24;letter-spacing:3px;font-size:.9rem;opacity:0;transition:.6s;text-shadow:0 2px 12px #000}.whisper.show{opacity:.85}
@media(max-width:480px){.card{height:82vh;padding-top:20vh}.sentinel{transform:translate(-50%,35px) scale(.72)}.sentinel.up{transform:translate(-50%,0) scale(.72)}#field{inset:14% 2% 20%}.acacia{transform:scale(.7);transform-origin:left bottom}}
</style></head>
<body><main id="stage"><div id="sun"></div><div class="hill far"></div><div class="acacia"></div><div class="hill near"></div><div class="grass"></div><div id="haze"></div><div id="status"></div><div id="hud"><button class="nav" onclick="Game.exit()">Exit</button><button class="nav" onclick="Game.toggleSound()" id="soundBtn">Sound On</button></div><div id="field"></div><div id="whisper" class="whisper"></div><div id="match-wrap"><button id="match" class="match" onclick="Game.respond()">Match</button></div>
<section id="gate"><div class="card"><div id="intro"><div class="title">Welcome to Sentinel</div><p class="desc">Keep watch over the savanna. When the sentinel appears in the same place as <span id="ruleWords">the previous appearance</span>, choose Match. Let every other appearance pass.</p><div class="levels"><button class="level-btn selected" onclick="Game.setN(1,this)">I</button><button class="level-btn" onclick="Game.setN(2,this)">II</button><button class="level-btn" onclick="Game.setN(3,this)">III</button><button class="level-btn" onclick="Game.setN(4,this)">IV</button></div><button class="primary" onclick="Game.start()">Begin Watch</button><div class="fine">Three short watches · quiet feedback · spatial working memory</div></div><div id="summary"><div class="title">Watch Complete</div><div class="metric">Accuracy<br><strong id="accuracy">—</strong></div><div class="metric">Correct matches<br><strong id="hits">—</strong></div><div class="metric">False alarms<br><strong id="falseAlarms">—</strong></div><p class="desc" id="reflection"></p><button class="primary" onclick="Game.resetGate()">Return</button></div></div></section></main>
<script>
const Game={n:1,sequence:[],trials:[],trial:0,hits:0,misses:0,falseAlarms:0,correctRejects:0,responded:false,timer:null,sound:true,audio:null,spots:[[14,65],[31,42],[50,68],[69,39],[85,63],[24,78],[60,80],[78,75]],trialsPerWatch:12,watches:3,
setN(n,el){this.n=n;document.querySelectorAll('.level-btn').forEach(b=>b.classList.remove('selected'));el.classList.add('selected');document.getElementById('ruleWords').textContent=n===1?'the previous appearance':n===2?'two appearances ago':n===3?'three appearances ago':'four appearances ago'},
initAudio(){if(!this.audio)this.audio=new(window.AudioContext||window.webkitAudioContext)();if(this.audio.state==='suspended')this.audio.resume()},tone(freq,d=.18,v=.035){if(!this.sound)return;this.initAudio();let o=this.audio.createOscillator(),g=this.audio.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.0001,this.audio.currentTime);g.gain.exponentialRampToValueAtTime(v,this.audio.currentTime+.025);g.gain.exponentialRampToValueAtTime(.0001,this.audio.currentTime+d);o.connect(g);g.connect(this.audio.destination);o.start();o.stop(this.audio.currentTime+d)},rustle(){if(!this.sound)return;this.initAudio();let len=this.audio.sampleRate*.13,b=this.audio.createBuffer(1,len,this.audio.sampleRate),x=b.getChannelData(0);for(let i=0;i<len;i++)x[i]=(Math.random()*2-1)*(1-i/len);let s=this.audio.createBufferSource(),f=this.audio.createBiquadFilter(),g=this.audio.createGain();s.buffer=b;f.type='bandpass';f.frequency.value=1700;g.gain.value=.025;s.connect(f);f.connect(g);g.connect(this.audio.destination);s.start();this.tone(520,.12,.012)},toggleSound(){this.sound=!this.sound;document.getElementById('soundBtn').textContent=this.sound?'Sound On':'Sound Off';if(this.sound)this.tone(420)},
build(){let total=this.trialsPerWatch*this.watches,locs=this.spots.length;this.sequence=[];for(let i=0;i<total;i++){let makeTarget=i>=this.n&&Math.random()<.28;let loc;if(makeTarget)loc=this.sequence[i-this.n];else{do{loc=Math.floor(Math.random()*locs)}while(i>=this.n&&loc===this.sequence[i-this.n]);}this.sequence.push(loc)}this.trials=this.sequence.map((loc,i)=>({loc,target:i>=this.n&&loc===this.sequence[i-this.n]}))},
renderSpots(){let f=document.getElementById('field');f.innerHTML='';this.spots.forEach((p,i)=>{let s=document.createElement('div');s.className='spot';s.style.left=p[0]+'%';s.style.top=p[1]+'%';s.id='spot'+i;s.innerHTML='<div class="sentinel"><div class="tail"></div><div class="body"><div class="chest"></div><div class="arm a"></div><div class="arm b"></div></div><div class="head"><div class="ear"></div><div class="eye"></div><div class="muzzle"><div class="nose"></div></div></div></div>';f.appendChild(s)})},
start(){this.initAudio();this.build();this.renderSpots();this.trial=0;this.hits=this.misses=this.falseAlarms=this.correctRejects=0;document.getElementById('gate').style.display='none';document.getElementById('hud').style.opacity=1;document.getElementById('match').classList.add('live');this.ambient();this.message('The watch begins');setTimeout(()=>this.next(),1200)},
ambient(){if(!this.sound||!this.audio)return;/* intentionally sparse: synthesized air rather than looping music */let o=this.audio.createOscillator(),g=this.audio.createGain(),f=this.audio.createBiquadFilter();o.type='sine';o.frequency.value=74;f.type='lowpass';f.frequency.value=180;g.gain.value=.006;o.connect(f);f.connect(g);g.connect(this.audio.destination);o.start();this.ambientOsc=o},
message(t){let w=document.getElementById('whisper');w.textContent=t;w.classList.add('show');setTimeout(()=>w.classList.remove('show'),900)},
next(){if(this.trial>=this.trials.length){this.finish();return}if(this.trial>0&&this.trial%this.trialsPerWatch===0){let watch=this.trial/this.trialsPerWatch+1;this.message('Watch '+watch+' of '+this.watches);this.timer=setTimeout(()=>this.showTrial(),1400)}else this.showTrial()},
showTrial(){this.responded=false;let t=this.trials[this.trial],el=document.querySelector('#spot'+t.loc+' .sentinel');document.getElementById('status').textContent='Sentinel '+['I','II','III','IV'][this.n-1]+' · Watch '+(Math.floor(this.trial/this.trialsPerWatch)+1)+' of '+this.watches;this.rustle();el.classList.add('up');setTimeout(()=>el.classList.remove('up'),1050);this.timer=setTimeout(()=>{if(t.target&&!this.responded)this.misses++;else if(!t.target&&!this.responded)this.correctRejects++;this.trial++;this.next()},1750)},
respond(){if(this.trial>=this.trials.length||this.responded)return;this.responded=true;let t=this.trials[this.trial],b=document.getElementById('match');if(t.target){this.hits++;this.tone(660,.28,.035);b.classList.add('hit');setTimeout(()=>b.classList.remove('hit'),300)}else{this.falseAlarms++;this.tone(230,.18,.018)}},
finish(){clearTimeout(this.timer);if(this.ambientOsc){try{this.ambientOsc.stop()}catch(e){}this.ambientOsc=null}document.getElementById('match').classList.remove('live');document.getElementById('hud').style.opacity=0;document.getElementById('status').textContent='';let total=this.hits+this.misses+this.falseAlarms+this.correctRejects,correct=this.hits+this.correctRejects,acc=Math.round(correct/total*100);document.getElementById('accuracy').textContent=acc+'%';document.getElementById('hits').textContent=this.hits;document.getElementById('falseAlarms').textContent=this.falseAlarms;document.getElementById('reflection').textContent=acc>=85?'A steady watch. Your spatial trace held with precision.':acc>=70?'A composed watch. The next round is an opportunity to sharpen the spatial trace.':'Keep the next watch at this level and allow the pattern to settle.';document.getElementById('intro').style.display='none';document.getElementById('summary').style.display='block';document.getElementById('gate').style.display='flex'},
resetGate(){document.getElementById('summary').style.display='none';document.getElementById('intro').style.display='block'},exit(){clearTimeout(this.timer);if(this.ambientOsc)try{this.ambientOsc.stop()}catch(e){}window.location.href='index.html?action=studio'}};
</script></body></html>
