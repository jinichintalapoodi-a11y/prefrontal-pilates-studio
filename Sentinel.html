<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sentinel — Location Test</title><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@1&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171006;color:#f7e7ce;font-family:'Playfair Display',serif;font-style:italic}.stage{position:relative;width:100vw;height:100dvh;overflow:hidden;background-image:linear-gradient(to bottom,rgba(12,10,8,.05),rgba(12,8,5,.02) 55%,rgba(9,6,4,.18) 100%),url('file_00000000e31881fda32f59a1a360dee5.png');background-size:cover;background-position:center center;background-repeat:no-repeat}.stage:after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.06),transparent 22%,transparent 78%,rgba(8,5,3,.24))}.hud{position:absolute;z-index:5;top:max(16px,env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;gap:12px}.pill,.match{color:#f7e7ce;font:inherit;font-style:italic;border:1px solid rgba(247,231,206,.62);background:rgba(43,23,43,.86);backdrop-filter:blur(12px);border-radius:40px}.pill{padding:10px 17px}.status{text-align:center;font-size:12px;line-height:1.45;letter-spacing:1.5px;text-transform:uppercase;text-shadow:0 2px 10px #000;max-width:190px}.subtitle{position:absolute;z-index:5;top:max(82px,calc(env(safe-area-inset-top) + 70px));left:50%;transform:translateX(-50%);white-space:nowrap;font-size:14px;letter-spacing:1.2px;text-shadow:0 2px 12px #000}.match{position:absolute;z-index:5;left:50%;bottom:max(24px,calc(env(safe-area-inset-bottom) + 18px));transform:translateX(-50%);width:min(280px,62vw);padding:15px;font-size:19px;letter-spacing:4px;text-transform:uppercase;opacity:.95}.marker{position:absolute;z-index:4;display:grid;place-items:center;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;border:1px solid rgba(247,231,206,.95);background:rgba(43,23,43,.82);box-shadow:0 3px 12px rgba(0,0,0,.45);font-size:16px;font-weight:600;font-style:normal}.m1{left:20%;top:60%}.m2{left:46%;top:58%}.m3{left:73%;top:59%}.m4{left:30%;top:68%}.m5{left:61%;top:68%}.m6{left:17%;top:77%}.m7{left:47%;top:76%}.m8{left:76%;top:77%}@media(max-width:600px){.hud{left:10px;right:10px}.pill{padding:9px 14px}.status{max-width:160px;font-size:11px}.stage{background-position:center center}}</style></head><body><main class="stage"><div class="hud"><button class="pill" id="exit">Exit</button><div class="status">Sentinel · Stage 2<br>Location Test</div><button class="pill" id="sound">Sound On</button></div><div class="subtitle">Choose the ground positions.</div><span class="marker m1">1</span><span class="marker m2">2</span><span class="marker m3">3</span><span class="marker m4">4</span><span class="marker m5">5</span><span class="marker m6">6</span><span class="marker m7">7</span><span class="marker m8">8</span><button class="match" type="button">Match</button></main><script>exit.onclick=()=>location.href='index.html?action=studio';let on=true;sound.onclick=function(){on=!on;this.textContent=on?'Sound On':'Sound Off'};</script></body></html>
