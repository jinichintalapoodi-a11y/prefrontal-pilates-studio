<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sentinel — Mound Test</title><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@1&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171006;color:#f7e7ce;font-family:'Playfair Display',serif;font-style:italic}.stage{--burrow-x:46.6%;--burrow-y:73.5%;position:relative;width:100vw;height:100dvh;overflow:hidden;background:url('sentinel_african_savanna.png') center/cover no-repeat}.stage:after{content:'';position:absolute;inset:0;z-index:8;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.04),transparent 24%,transparent 82%,rgba(8,5,3,.12))}.hud{position:absolute;z-index:20;top:max(16px,env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{color:#f7e7ce;font:inherit;border:1px solid rgba(247,231,206,.65);background:rgba(43,23,43,.88);backdrop-filter:blur(12px);border-radius:40px;padding:10px 17px}.status{text-align:center;font-size:12px;line-height:1.45;letter-spacing:1.5px;text-transform:uppercase;text-shadow:0 2px 10px #000;max-width:230px}.mound{position:absolute;z-index:9;left:var(--burrow-x);top:var(--burrow-y);width:clamp(230px,28vw,430px);height:clamp(92px,11vw,165px);transform:translate(-50%,-42%);pointer-events:none}.mound-soil{position:absolute;inset:8% 0 0;border-radius:47% 53% 42% 58%/73% 68% 32% 27%;background:radial-gradient(ellipse at 48% 22%,rgba(112,62,16,.98) 0 15%,rgba(132,75,20,.94) 32%,rgba(103,55,13,.9) 52%,rgba(71,36,9,.78) 70%,transparent 83%);filter:drop-shadow(0 6px 7px rgba(29,14,3,.36));transform:rotate(-1deg)}.mound-soil:before{content:'';position:absolute;left:4%;right:5%;bottom:3%;height:47%;border-radius:50%;background:radial-gradient(ellipse,rgba(62,30,7,.55),rgba(104,55,13,.4) 48%,transparent 75%);transform:rotate(2deg)}.opening{position:absolute;z-index:2;left:50%;top:18%;width:48%;height:34%;transform:translateX(-50%);border-radius:48% 52% 51% 49%/54% 49% 51% 46%;background:radial-gradient(ellipse at 50% 55%,rgba(5,3,2,1) 0 45%,rgba(25,13,4,.99) 58%,rgba(70,34,8,.94) 72%,transparent 82%);box-shadow:inset 0 8px 11px rgba(0,0,0,.75)}.front-bank{position:absolute;z-index:3;left:5%;right:4%;top:38%;height:55%;border-radius:46% 54% 50% 50%/54% 58% 42% 46%;background:radial-gradient(ellipse at 48% 4%,rgba(137,76,18,.96),rgba(111,57,13,.88) 37%,rgba(75,35,8,.72) 64%,transparent 82%);transform:rotate(.7deg)}.front-bank:before,.front-bank:after{content:'';position:absolute;border-radius:50%;background:rgba(69,31,7,.48);filter:blur(.4px)}.front-bank:before{width:31%;height:34%;left:5%;top:28%;transform:rotate(-8deg)}.front-bank:after{width:27%;height:29%;right:8%;top:21%;transform:rotate(9deg)}.mound-grass{position:absolute;z-index:4;left:-5%;right:-5%;bottom:1%;height:42%;background:repeating-linear-gradient(76deg,transparent 0 10px,rgba(151,90,22,.34) 11px 12px,transparent 13px 20px);mask-image:linear-gradient(to top,#000,transparent 92%);opacity:.85}@media(max-width:600px){.hud{left:10px;right:10px}.pill{padding:9px 14px}.status{font-size:10px;max-width:165px}.mound{width:clamp(220px,56vw,310px);height:clamp(90px,24vw,128px)}}</style></head><body><main class="stage"><div class="hud"><button class="pill" id="exit">Exit</button><div class="status">Sentinel · Mound Test<br>Empty Burrow Only</div><button class="pill" id="sound">Sound On</button></div><div class="mound" aria-hidden="true"><div class="mound-soil"></div><div class="opening"></div><div class="front-bank"></div><div class="mound-grass"></div></div></main><script>document.getElementById('exit').onclick=()=>location.href='index.html?action=studio';let soundOn=true;document.getElementById('sound').onclick=function(){soundOn=!soundOn;this.textContent=soundOn?'Sound On':'Sound Off'};</script></body></html>
