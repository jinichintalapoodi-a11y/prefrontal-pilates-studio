<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sentinel — Single Emergence Test</title><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@1&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171006;color:#f7e7ce;font-family:'Playfair Display',serif;font-style:italic}.stage{position:relative;width:100vw;height:100dvh;overflow:hidden;background:url('sentinel_african_savanna.png') center/cover no-repeat}.stage:after{content:'';position:absolute;inset:0;z-index:8;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.04),transparent 24%,transparent 82%,rgba(8,5,3,.12))}.hud{position:absolute;z-index:20;top:max(16px,env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;gap:12px}.pill,.test{color:#f7e7ce;font:inherit;border:1px solid rgba(247,231,206,.65);background:rgba(43,23,43,.88);backdrop-filter:blur(12px);border-radius:40px}.pill{padding:10px 17px}.status{text-align:center;font-size:12px;line-height:1.45;letter-spacing:1.5px;text-transform:uppercase;text-shadow:0 2px 10px #000;max-width:210px}.test{position:absolute;z-index:20;left:50%;bottom:max(24px,calc(env(safe-area-inset-bottom) + 18px));transform:translateX(-50%);width:min(330px,72vw);padding:15px;font-size:17px;letter-spacing:2px}
/* Mask ends at the CENTER of the burrow mouth, so the animal crosses through the opening rather than behind the whole oval. */
.emergence{position:absolute;z-index:6;left:46.6%;top:73.5%;width:clamp(105px,12.5vw,205px);height:clamp(300px,42vw,560px);transform:translate(-50%,-100%);overflow:hidden;pointer-events:none}.meerkat{position:absolute;z-index:2;left:50%;bottom:-2px;width:100%;height:auto;transform:translate(-50%,105%) scale(.94);transform-origin:50% 100%;filter:brightness(1.08) saturate(.9) contrast(1.05) drop-shadow(0 8px 7px rgba(25,12,3,.3));will-change:transform}.emergence.active .meerkat{animation:sentinelMove 5.6s linear both}
/* Burrow is split into a rear rim and a front lip. Sentinel renders between them. */
.burrow-back{position:absolute;z-index:4;left:46.6%;top:73.5%;width:clamp(100px,12vw,190px);height:clamp(25px,3.2vw,48px);transform:translate(-50%,-50%);border-radius:48% 52% 46% 54%/43% 47% 53% 57%;background:radial-gradient(ellipse at 50% 50%,rgba(20,12,5,.98) 0 43%,rgba(54,32,11,.92) 48%,rgba(120,74,26,.62) 62%,rgba(171,111,43,.25) 73%,transparent 77%);box-shadow:inset 0 4px 7px rgba(5,3,1,.55);pointer-events:none}.burrow-front{position:absolute;z-index:7;left:46.6%;top:73.5%;width:clamp(104px,12.5vw,198px);height:clamp(17px,2vw,31px);transform:translate(-50%,0);border-radius:0 0 52% 48%/0 0 75% 75%;background:radial-gradient(ellipse at 50% 0,rgba(83,48,15,.88) 0 28%,rgba(126,78,27,.66) 48%,rgba(170,110,42,.25) 70%,transparent 78%);filter:blur(.3px);pointer-events:none}.grass-veil{position:absolute;z-index:8;left:46.6%;top:73.5%;width:clamp(115px,14vw,225px);height:clamp(24px,3vw,44px);transform:translate(-50%,0);border-radius:50%;background:radial-gradient(ellipse at center,rgba(102,61,19,.13) 0 40%,rgba(145,87,24,.1) 57%,transparent 73%);filter:blur(1px);pointer-events:none}
@keyframes sentinelMove{0%{transform:translate(-50%,105%) scale(.94)}20%{transform:translate(-50%,0) scale(.94)}55%{transform:translate(-50%,0) scale(.94)}100%{transform:translate(-50%,105%) scale(.94)}}
@media(max-width:600px){.hud{left:10px;right:10px}.pill{padding:9px 14px}.status{font-size:10px;max-width:155px}.emergence{left:46.6%;top:73.5%;width:clamp(112px,28vw,150px);height:clamp(300px,78vw,430px)}.burrow-back{left:46.6%;top:73.5%;width:clamp(105px,29vw,155px);height:clamp(27px,7.5vw,42px)}.burrow-front{left:46.6%;top:73.5%;width:clamp(108px,30vw,160px);height:clamp(18px,5vw,29px)}.grass-veil{left:46.6%;top:73.5%;width:clamp(120px,31vw,165px)}}@media(prefers-reduced-motion:reduce){.emergence.active .meerkat{animation-duration:7s}}
</style></head><body><main class="stage"><div class="hud"><button class="pill" id="exit">Exit</button><div class="status">Sentinel · Emergence Test<br>One Burrow Only</div><button class="pill" id="sound">Sound On</button></div><div class="burrow-back" aria-hidden="true"></div><div class="emergence" id="emergence"><img class="meerkat" src="sentinel_meerkat.png?v=22f16ae0" alt=""></div><div class="burrow-front" aria-hidden="true"></div><div class="grass-veil" aria-hidden="true"></div><button class="test" id="test" type="button">Show Sentinel</button></main><script>const emergence=document.getElementById('emergence'),test=document.getElementById('test');document.getElementById('exit').onclick=()=>location.href='index.html?action=studio';let soundOn=true;document.getElementById('sound').onclick=function(){soundOn=!soundOn;this.textContent=soundOn?'Sound On':'Sound Off'};function showSentinel(){emergence.classList.remove('active');void emergence.offsetWidth;emergence.classList.add('active')}test.addEventListener('click',showSentinel);</script></body></html>
