<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sentinel — Background Test</title><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@1&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171006;color:#f7e7ce;font-family:'Playfair Display',serif;font-style:italic}.stage{position:relative;width:100vw;height:100dvh;overflow:hidden;background-image:linear-gradient(to bottom,rgba(12,10,8,.10),rgba(12,8,5,.04) 52%,rgba(9,6,4,.28) 100%),url('https://images.unsplash.com/photo-1516026672322-bc52d61a55d5?auto=format&fit=crop&q=92&w=1800');background-size:cover;background-position:center center}.stage:after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 78% 34%,rgba(255,197,105,.20),transparent 30%),linear-gradient(to bottom,rgba(0,0,0,.08),transparent 25%,transparent 72%,rgba(8,5,3,.35))}.hud{position:absolute;z-index:5;top:max(16px,env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;gap:12px}.pill,.match{color:#f7e7ce;font:inherit;font-style:italic;border:1px solid rgba(247,231,206,.62);background:rgba(43,23,43,.86);backdrop-filter:blur(12px);border-radius:40px}.pill{padding:10px 17px}.status{text-align:center;font-size:12px;line-height:1.45;letter-spacing:1.5px;text-transform:uppercase;text-shadow:0 2px 10px #000;max-width:190px}.subtitle{position:absolute;z-index:5;top:max(82px,calc(env(safe-area-inset-top) + 70px));left:50%;transform:translateX(-50%);white-space:nowrap;font-size:14px;letter-spacing:1.2px;text-shadow:0 2px 12px #000}.match{position:absolute;z-index:5;left:50%;bottom:max(24px,calc(env(safe-area-inset-bottom) + 18px));transform:translateX(-50%);width:min(280px,62vw);padding:15px;font-size:19px;letter-spacing:4px;text-transform:uppercase;opacity:.95}.note{position:absolute;z-index:5;left:50%;bottom:max(94px,calc(env(safe-area-inset-bottom) + 88px));transform:translateX(-50%);width:min(390px,88vw);text-align:center;padding:9px 14px;border-radius:28px;background:rgba(15,10,8,.38);backdrop-filter:blur(8px);font-size:12px;letter-spacing:.6px;text-shadow:0 2px 8px #000}@media(max-width:600px){.hud{left:10px;right:10px}.pill{padding:9px 14px}.status{max-width:160px;font-size:11px}.stage{background-position:center center}}</style></head><body><main class="stage"><div class="hud"><button class="pill" id="exit">Exit</button><div class="status">Sentinel · Stage 1<br>Background Test</div><button class="pill" id="sound">Sound On</button></div><div class="subtitle">Keep watch. Notice. Remember.</div><div class="note">Background only — no burrows or Sentinel yet.</div><button class="match" type="button">Match</button></main><script>exit.onclick=()=>location.href='index.html?action=studio';let on=true;sound.onclick=function(){on=!on;this.textContent=on?'Sound On':'Sound Off'};</script></body></html>
