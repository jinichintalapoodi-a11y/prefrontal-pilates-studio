<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sentinel</title><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@1&display=swap" rel=stylesheet><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#171006;color:#f7e7ce;font-family:'Playfair Display',serif;font-style:italic}.s{height:100dvh;position:relative;background:linear-gradient(#0001,#1b0e0566),url('https://images.unsplash.com/photo-1756475471671-48813cf5ea5b?auto=format&fit=crop&q=88&w=1800') center/cover}.s:after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 78% 38%,#ffd37a38,transparent 26%),linear-gradient(transparent 58%,#120a04aa);pointer-events:none}.hud{position:absolute;z-index:9;top:max(16px,env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between;align-items:center}.p,.btn,.match{color:#f7e7ce;font:inherit;font-style:italic;border:1px solid #f7e7ce99;background:#2b172bd9;border-radius:40px;padding:10px 17px}.status{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;text-shadow:0 2px 10px #000}.field{position:absolute;z-index:3;left:2%;right:2%;top:48%;bottom:17%}.spot{position:absolute}.hole{position:absolute;left:50%;top:0;transform:translate(-50%,-50%);width:84px;height:44px;border-radius:50%;background:radial-gradient(ellipse,#080604 0 29%,#3f2917 31%,#80552caa 48%,#6d49294a 61%,transparent 72%)}.mw{position:absolute;left:50%;top:0;width:98px;height:142px;transform:translate(-50%,-91%) translateY(38px);opacity:0;overflow:hidden;transition:.45s;filter:drop-shadow(0 5px 5px #000b);-webkit-mask:radial-gradient(ellipse 43% 51% at 50% 49%,#000 0 69%,transparent 74%);mask:radial-gradient(ellipse 43% 51% at 50% 49%,#000 0 69%,transparent 74%)}.mw img{width:100%;height:100%;object-fit:cover;object-position:50% 28%;transform:scale(1.16)}.spot.on .mw{opacity:1;transform:translate(-50%,-91%) translateY(0)}.lip{position:absolute;left:50%;top:0;transform:translate(-50%,-35%);width:70px;height:18px;border-radius:50%;background:linear-gradient(#76502e,#2c1b10)}.match{position:absolute;z-index:10;left:50%;bottom:max(24px,calc(env(safe-area-inset-bottom) + 16px));transform:translateX(-50%);width:min(280px,62vw);font-size:19px;letter-spacing:4px;text-transform:uppercase;opacity:0;pointer-events:none}.match.live{opacity:1;pointer-events:auto}.ov{position:absolute;z-index:20;inset:0;display:grid;place-items:end center;padding:20px 20px max(40px,env(safe-area-inset-bottom));background:linear-gradient(transparent,#08060466)}.card{width:min(440px,94vw);padding:26px 22px;text-align:center;border:1px solid #f7e7ce99;border-radius:36px;background:#211522ed;backdrop-filter:blur(16px)}h2{margin:0 0 12px}p{line-height:1.55}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.btn{min-width:145px}.hide{display:none}.toast{position:absolute;z-index:12;top:43%;left:50%;transform:translate(-50%,-50%);background:#160e09c9;border-radius:25px;padding:8px 14px;opacity:0}.toast.on{opacity:1}@media(max-width:600px){.status{max-width:170px;text-align:center}.field{top:49%;bottom:18%}.hole{width:76px}.mw{width:91px;height:134px}}</style></head><body><main class=s><div class=hud><button class=p id=exit>Exit</button><div class=status id=st>Sentinel I · Watch 1 of 3</div><button class=p id=sound>Sound On</button></div><div class=field id=f></div><div class=toast id=t></div><button class=match id=m>Match</button><section class=ov id=intro><div class=card><h2>Keep Watch</h2><p>Notice where the Sentinel appears. If it returns to the <b>same place as the previous appearance</b>, tap <b>MATCH</b>.<br><br>If it appears somewhere different, simply keep watching.</p><div class=actions><button class=btn id=demo>Show Me</button><button class=btn id=begin>Begin Practice</button></div></div></section><section class="ov hide" id=sum><div class=card><h2>Watch Complete</h2><p id=result></p><button class=btn id=again>Continue</button></div></section></main><script>const IMG='https://upload.wikimedia.org/wikipedia/commons/8/85/Meerkat.jpg',P=[[8,18],[31,8],[54,17],[78,7],[92,23],[20,64],[50,69],[80,59]],G={n:1,q:[],i:0,hit:0,miss:0,fa:0,cr:0,answered:0,demo:0,sound:1,a:null,init(){f.innerHTML=P.map((p,i)=>`<div class=spot id=s${i} style="left:${p[0]}%;top:${p[1]}%"><div class=hole></div><div class=mw><img src="${IMG}" alt=""></div><div class=lip></div></div>`).join('')},audio(){if(!this.a)this.a=new(AudioContext||webkitAudioContext);if(this.a.state==='suspended')this.a.resume()},tone(x){if(!this.sound)return;this.audio();let o=this.a.createOscillator(),g=this.a.createGain();o.frequency.value=x;g.gain.value=.018;o.connect(g);g.connect(this.a.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,this.a.currentTime+.35);o.stop(this.a.currentTime+.36)},msg(x){t.textContent=x;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),900)},build(k){this.q=[];for(let i=0;i<k;i++){let z=i>=this.n&&Math.random()<.28,l;if(z)l=this.q[i-this.n].l;else do l=Math.floor(Math.random()*8);while(i>=this.n&&l===this.q[i-this.n].l);this.q.push({l,target:i>=this.n&&l===this.q[i-this.n].l})}},start(d){this.demo=d;this.n=1;this.i=this.hit=this.miss=this.fa=this.cr=0;intro.classList.add('hide');m.classList.add('live');if(d)this.q=[{l:0,target:0},{l:3,target:0},{l:3,target:1},{l:6,target:0},{l:2,target:0},{l:2,target:1}];else this.build(42);this.tone(392);setTimeout(()=>this.next(),700)},next(){if(this.i>=this.q.length)return this.done();let x=this.q[this.i],s=document.getElementById('s'+x.l);this.answered=0;st.textContent=`Sentinel ${['I','II','III','IV'][this.n-1]} · Watch ${Math.floor(this.i/14)+1} of 3`;s.classList.add('on');this.tone(470);if(this.demo)this.msg(this.i===0?'Remember this place.':x.target?'Same place — tap MATCH.':'Different place — keep watching.');setTimeout(()=>{s.classList.remove('on');if(!this.answered)x.target?this.miss++:this.cr++;this.i++;setTimeout(()=>this.next(),650)},1450)},press(){if(this.answered)return;this.answered=1;let x=this.q[this.i];if(x.target){this.hit++;this.tone(660);if(this.demo)this.msg('Yes — that is a match.')}else{this.fa++;this.tone(230)}},done(){m.classList.remove('live');if(this.demo){intro.classList.remove('hide');intro.querySelector('h2').textContent='You’re Ready';intro.querySelector('p').innerHTML='That is the whole idea.<br><br>If you lose your place, simply begin again with the next appearance.';intro.querySelector('.actions').innerHTML='<button class=btn id=go>Begin Practice</button>';go.onclick=()=>this.start(0);return}let total=this.hit+this.miss+this.fa+this.cr,acc=Math.round((this.hit+this.cr)/total*100),hr=this.hit/(this.hit+this.miss||1),fr=this.fa/(this.fa+this.cr||1);if(hr>=.8&&fr<=.15&&this.n<4)this.n++;result.innerHTML=`Accuracy <b>${acc}%</b><br>Correct matches <b>${this.hit}</b><br>False alarms <b>${this.fa}</b><br><br>${this.n>1?'Your watch was steady. The next watch will quietly become more challenging.':'Stay with this rhythm. Consistency matters more than speed.'}`;sum.classList.remove('hide')}};G.init();demo.onclick=()=>G.start(1);begin.onclick=()=>G.start(0);m.onclick=()=>G.press();again.onclick=()=>{sum.classList.add('hide');G.start(0)};exit.onclick=()=>location.href='index.html?action=studio';sound.onclick=function(){G.sound=!G.sound;this.textContent=G.sound?'Sound On':'Sound Off'};</script></body></html>
